<style>

de cinco meses."}, {"tipo": "Denúncia", "numero": null, "data": "2022-05-23", "resumo": "Vereador relata que leite distribuído a famílias pelo programa social do município (fabricação de 19/05, validade até 25/05) foi entregue estragado/azedo na quinta-feira anterior, deixando famílias que dependiam exclusivamente desse leite sem o produto durante o final de semana; a distribuidora alegou problema em máquina de fabricação.", "nota": "Vereador relatou ter recebido fotos e questionamentos de várias mães; problema foi reconhecido e reposição foi feita na sessão seguinte à queixa."}, {"tipo": "Denúncia", "numero": null, "data": "2022-05-30", "resumo": "Vereadores questionam o destino de cerca de R$ 201 mil aprovados nessa Casa em 2021 para a construção de uma usina de oxigênio na Santa Casa; a obra nunca foi realizada (segundo o diretor de saúde, o rompimento do contrato com o fornecedor de oxigênio não seria compensatório), sem que o valor tenha retornado aos cofres públicos ou tenha havido explicação clara sobre o ocorrido, enquanto a Câmara aprovava nova verba para custeio de oxigênio.", "nota": "Discussão ocorreu durante a votação do Projeto de Lei Complementar nº 31/2022; vereador Valdir ressalta não estar acusando má gestão, mas questionando o que ocorreu com o valor já destinado."}, {"tipo": "Denúncia", "numero": null, "data": "2022-05-30", "resumo": "Vereador relata ter sido chamado publicamente de 'vagabundo', 'sem-vergonha' e 'safado' por um vice-diretor de escola, em reunião de diretores de escolas da região, por conta de postagens do vereador nas redes sociais sobre crianças caminhando na chuva a caminho da escola.", "nota": "Vereador não identificou o nome do vice-diretor nem a escola de origem dele durante a fala."}, {"tipo": "Denúncia", "numero": null, "data": "2022-06-06", "resumo": "Vereador denuncia a destruição de vegetação em um trecho de aproximadamente 100 a 150 metros próximo à sua residência, ocorrida sem autorização da diretoria de meio ambiente, segundo confirmado por telefone pela responsável do setor (Bianca), que atribuiu a atividade ao setor de obras e afirmou não ter assinado nenhuma autorização; vereador afirma que fará denúncia formal caso não haja autorização válida.", "nota": "Vereador associa o episódio à contradição com a 'Semana do Meio Ambiente' promovida pela administração na mesma semana."}, {"tipo": "Requerimento", "numero": null, "data": "2022-06-06", "resumo": "Durante a discussão do Projeto de Lei Complementar nº 33/2022 (abertura de crédito adicional especial de R$ 489 mil), o vereador anunciou verbalmente que votaria favoravelmente ao projeto, mas pediria por escrito informações discriminadas sobre a aplicação dos recursos, em especial os cerca de R$ 349 mil destinados ao setor de água e esgoto; o presidente confirmou em plenário que o requerimento formal seria protocolado posteriormente.", "nota": "Pedido verbal feito em explicações pessoais, sem número formal atribuído nesta sessão; não há confirmação, nas sessões seguintes lidas neste lote, de que o requerimento tenha sido de fato protocolado com numeração própria. Diretoria de destino inferida (o valor discutido pelo vereador refere-se à ficha do setor de água e esgoto), mas não foi explicitada no pedido verbal."}, {"tipo": "Denúncia", "numero": null, "data": "2022-06-14", "resumo": "Vereador relata caso de uma mãe cadeirante cujo filho, paciente do CAPS com necessidades especiais, foi levado a uma consulta fora do serviço; ao tentar contato para buscar o filho, foi tratada com grosseria por funcionário do CAPS, que teria bloqueado seu número, deixando-a sem meio de contato e o filho sem transporte de volta por horas. Após desabafo da mãe nas redes sociais (com cerca de 50 compartilhamentos e outros relatos semelhantes de medo de denunciar), o funcionário abriu processo contra ela.", "nota": "Vereador também relata que, em outra ocasião, o mesmo paciente não recebeu alimentação no CAPS; no primeiro episódio o secretário de saúde interveio e resolveu, no segundo não."}, {"tipo": "Denúncia", "numero": null, "data": "2022-06-27", "resumo": "Relatório final da Comissão de Obras, Serviços Públicos e Atividades Privadas da Câmara sobre o processo de ouvidoria nº 03/2021, referente a denúncia apresentada pelo cidadão José Antônio Árabe Henrique sobre suposto uso indevido, pela Prefeitura, do leito e dos trilhos da linha férrea (área da concessionária Rumo Malha Paulista S.A.), incluindo remoção de trilhos, construção de bancos, gramados, pergolados, academia ao ar livre, pista de caminhada em concreto e passarelas, sem autorização da concessionária. A comissão concluiu haver indícios de investimento irregular de recursos públicos em área de faixa de domínio da concessionária e recomendou o encaminhamento de cópia do relatório final e do processo integral ao Tribunal de Contas do Estado de São Paulo e ao Ministério Público para apuração e eventual responsabilização.", "nota": "Denúncia original protocolada em 2021 (processo aberto em 19/07/2021); o relatório final da comissão foi lido e constou do expediente desta sessão (27/06/2022). Vereadores listados são os membros da comissão que assinaram o relatório (Anderson Marcos Viana, presidente; Marisa Alves da Silva Costa e Paulo Sérgio Cordeiro, membros)."}, {"tipo": "Denúncia", "numero": null, "data": "2022-06-27", "resumo": "Vereador relata ter percorrido cerca de 22 a 25 km em área rural do município (da Rua Belém, próximo ao Lar do Menor, até o Rio Caingans) e constatado nascentes, córregos e rios tomados por esgoto doméstico irregular, com animais mortos (peixes, cágados) e animais obrigados a beber água contaminada; filmou e fotografou a situação e conversou com o setor de obras responsável, que atribuiu o problema a ligações irregulares de esgoto feitas por moradores diretamente nas bocas de lobo.", "nota": "Relato feito em explicações pessoais na tribuna, sem número formal ou requerimento associado nesta sessão. Diretoria de destino inferida (assunto de meio ambiente/saneamento), não citada explicitamente pelo vereador."}, {"tipo": "Denúncia", "numero": null, "data": "2022-06-27", "resumo": "Vereador questiona processo seletivo realizado cerca de 15 dias antes pela Santa Casa de Junqueirópolis, com inscrição paga (R$ 40 para vagas de faxina, R$ 50 para outras) em regime de cadastro de reserva (sem garantia de contratação), enquanto, na mesma época, a entidade teria contratado uma enfermeira padrão por análise de currículo, sem qualquer processo seletivo ou prova, mesmo em meio a alegadas dificuldades financeiras da instituição.", "nota": "Entidade envolvida (Santa Casa de Misericórdia de Junqueirópolis) não é uma diretoria municipal, por isso 'direcionada_a' ficou nulo; campo 'resumo' menciona a entidade. Relato feito em explicações pessoais, sem documento formal associado nesta sessão."}, {"tipo": "Indicação", "numero": "057", "data": "2022-06-27", "resumo": "Solicita a implantação de iluminação no trevo de acesso ao bairro Duas Barras, em razão de diversos pedidos da população que relatam acidentes, roubos e demais transtornos causados pela falta de iluminação no local.", "nota": "Nome do arquivo indica 2022-06-28, mas o texto da transcrição afirma explicitamente que o expediente é 'da 63ª Sessão Ordinária... a ser realizada em 27 de junho de 2022' (uma segunda-feira, consistente com o padrão semanal das sessões); usada a data do texto."}, {"tipo": "Indicação", "numero": "058", "data": "2022-06-27", "resumo": "Solicita que as unidades de Estratégia de Saúde da Família (ESF) também possam distribuir medicamentos à população, para amenizar o intenso movimento e as filas no Centro de Saúde central.", "nota": "Nome do arquivo indica 2022-06-28; texto integral confirma sessão de 27 de junho de 2022 (ver nota da indicação 057 da mesma sessão)."}, {"tipo": "Indicação", "numero": "059", "data": "2022-06-27", "resumo": "Solicita a instalação de um playground no bairro Jardim Conde, para proporcionar área de recreação às crianças que moram na região.", "nota": "Nome do arquivo indica 2022-06-28; texto integral confirma sessão de 27 de junho de 2022 (ver nota da indicação 057 da mesma sessão)."}, {"tipo": "Indicação", "numero": "060", "data": "2022-06-27", "resumo": "Reforça a indicação nº 12/2021 e solicita a instalação de redutores de velocidade em pontos estratégicos da Rua Constantino Marcolino de Souza, em razão do fluxo de veículos em alta velocidade que causa transtornos aos pedestres.", "nota": "Nome do arquivo indica 2022-06-28; texto integral confirma sessão de 27 de junho de 2022 (ver nota da indicação 057 da mesma sessão)."}, {"tipo": "Indicação", "numero": "061", "data": "2022-06-27", "resumo": "Reforça a indicação nº 98/2021 e solicita o recapeamento asfáltico no prolongamento das ruas Jacinto José Alegrete e Guerino Val, além de melhorias nas ruas adjacentes, devido aos buracos que dificultam o tráfego.", "nota": "Nome do arquivo indica 2022-06-28; texto integral confirma sessão de 27 de junho de 2022 (ver nota da indicação 057 da mesma sessão)."}, {"tipo": "Requerimento", "numero": "012", "data": "2022-06-27", "resumo": "Solicita ao prefeito municipal informações sobre a quantidade de empregos gerados até o momento pelas empresas contempladas com lotes no Distrito Industrial 4, com detalhamento do compromisso de contratações de cada empresa e o número de funcionários já contratados.", "nota": "Nome do arquivo indica 2022-06-28, mas o texto do expediente afirma que a sessão é 'a ser realizada em 27 de junho de 2022'; usada a data do texto. Diretoria de destino inferida (assunto trata de empresas do distrito industrial), não foi explicitada no requerimento."}, {"tipo": "Indicação", "numero": "062", "data": "2022-08-01", "resumo": "Solicita a nomeação do saudoso José Fernandes Filho para a praça localizada no bairro Delta Ville 1, em homenagem a um dos primeiros moradores da cidade.", "nota": "Nome do arquivo indica 2022-08-02, mas o texto afirma que o expediente é 'da 64ª Sessão Ordinária... a ser realizada em 1º de agosto de 2022' (segunda-feira); usada a data do texto."}, {"tipo": "Indicação", "numero": "063", "data": "2022-08-01", "resumo": "Solicita a construção de uma área de lazer e playground de frente à Rua Vereador Gélcio José da Silva (bairro Frei Galvão), bem como a implantação de iluminação no local.", "nota": "O resumo do expediente citou apenas Anderson Marcos Viana e Valdir Aparecido de Oliveira como autores, mas o texto integral lido em plenário inclui também Elio Furini Neto; usados os autores do texto integral. Data da sessão: ver nota da indicação 062."}, {"tipo": "Denúncia", "numero": null, "data": "2022-08-08", "resumo": "Vereador comenta caso de maus-tratos a uma cadela ocorrido no final de semana anterior, relatando que moradores tiveram coragem de acionar advogados e registrar boletim de ocorrência contra o responsável, que não ficará impune; parabeniza os envolvidos pela iniciativa e menciona que a vereadora Marisa também já havia tentado agir em casos semelhantes.", "nota": "Não foi possível identificar com segurança se a denúncia/BO foi feita pela população, por advogados ou encaminhada ao próprio vereador; ele apenas comenta e parabeniza o desfecho na tribuna. Sem diretoria de destino explícita (caso já estava em tramitação policial/judicial, não administrativa)."}, {"tipo": "Denúncia", "numero": null, "data": "2022-08-08", "resumo": "Vereador relata que chegou nova denúncia à Comissão de Obras (da qual é presidente, com Paulo Sérgio Cordeiro e Marisa Alves da Silva Costa como membros) sobre a continuidade de obras na faixa de domínio da linha férrea (bancos, pilares e mesas de concreto), reafirmando que a comissão não autorizou tais intervenções e que o assunto está sendo investigado; também menciona que uma empresa contratada pela Rumo Logística está demarcando árvores na área para possível corte, e cita reuniões com a concessionária sobre a eventual retomada de trens cargueiros na malha ferroviária.", "nota": "Continuação do tema tratado no relatório da Comissão de Obras sobre o processo 03/2021, lido na sessão de 2022-06-27 (ver lote anterior). Vereadores listados são os membros da Comissão de Obras citados pelo próprio vereador nesta fala."}, {"tipo": "Denúncia", "numero": null, "data": "2022-08-08", "resumo": "Vereador cobra da administração providências sobre a venda e locação irregular de casas populares do Residencial das Américas, alegando que a situação 'virou palhaçada', com casas alugadas ou fechadas em vez de destinadas aos suplentes da fila de espera; relembra um episódio semelhante ocorrido em 2012, quando teria sofrido represálias por denunciar um esquema de desvio de casas populares alugadas irregularmente.", "nota": "Motivou o Requerimento nº 013/2022, apresentado pelo mesmo vereador na sessão seguinte (2022-08-15), solicitando informações formais sobre a fiscalização do Residencial das Américas (ver raw_requerimentos). Diretoria de destino inferida (assunto de habitação), não foi citada explicitamente pelo vereador."}, {"tipo": "Indicação", "numero": "065", "data": "2022-08-08", "resumo": "Solicita a instalação de canaletas na esquina da Rua Ilásio Bedamar Buso com a Rua Manuel Vicente Monteiro (bairro Carmezim 1), para direcionar corretamente o fluxo de águas pluviais.", "nota": "Nome do arquivo indica 2022-08-09, mas o texto afirma que o expediente é 'da 65ª Sessão Ordinária... a ser realizada em 8 de agosto de 2022' (segunda-feira); usada a data do texto."}, {"tipo": "Indicação", "numero": "068", "data": "2022-08-08", "resumo": "Solicita a pavimentação do trecho que liga os bairros Jardim Alvorada e Jardim Fluentes, localizado entre as ruas mencionadas como 'Vereadora Augusta Stander Raineri' e 'Avenida Edwvirges Anna Aparecida Trevisan'.", "nota": "Nomes das ruas incertos: a transcrição traz grafias distintas em diferentes trechos ('Augusta Standard Raineri' / 'Adivide-Estrevizan'), provavelmente 'Vereadora Augusta Stander Raineri' e 'Avenida Edwvirges Anna Aparecida Trevisan' (nome que aparece corretamente em indicações posteriores). Data da sessão: ver nota da indicação 065."}, {"tipo": "Indicação", "numero": "069", "data": "2022-08-15", "resumo": "Reforça a indicação nº 105/2021 e solicita a instalação de bebedouros de água potável em locais estratégicos da Praça do Cristo Redentor, além da construção de sanitários públicos (feminino e masculino) no Parque Ecológico.", "nota": "Nome do arquivo indica 2022-08-16, mas o texto afirma que o expediente é 'da 66ª Sessão Ordinária... a ser realizada em 15 de agosto de 2022' (segunda-feira); usada a data do texto."}, {"tipo": "Requerimento", "numero": "013", "data": "2022-08-15", "resumo": "Solicita ao prefeito municipal informações sobre a fiscalização no conjunto habitacional Residencial das Américas em favor dos suplentes contemplados pelas casas populares que aguardam na fila, tendo em vista que muitas moradias se encontram à venda, alugadas ou fechadas, prejudicando moradores em situação de vulnerabilidade que necessitam de habitação.", "nota": "Diretoria de destino inferida por tratar de habitação, não foi explicitada no requerimento. Tema relacionado a denúncia informal do mesmo vereador sobre venda irregular de casas populares no Residencial das Américas, relatada na sessão de 2022-08-09 (ver raw_denuncias)."}, {"tipo": "Requerimento", "numero": "014", "data": "2022-08-15", "resumo": "Solicita ao prefeito municipal informações sobre a quantidade de prédios alugados pelo Poder Executivo municipal e os respectivos valores dos aluguéis, discriminando os imóveis alugados nos anos de 2020, 2021 e 2022.", "nota": "Diretoria de destino inferida (assunto administrativo/financeiro), não foi explicitada no requerimento."}, {"tipo": "Indicação", "numero": "075", "data": "2022-08-22", "resumo": "Solicita sinalização de solo nas canaletas existentes na Rua Dom Pedro II, esquinas com as ruas São Luís e das Américas, para reduzir a velocidade dos veículos e evitar acidentes na travessia.", "nota": "Nome do arquivo indica 2022-08-23, mas o texto afirma que o expediente é 'da 67ª Sessão Ordinária... a ser realizada em 22 de agosto de 2022' (segunda-feira); usada a data do texto."}, {"tipo": "Requerimento", "numero": "015", "data": "2022-08-22", "resumo": "Solicita ao prefeito municipal que informe detalhadamente se houve mudança na forma de cálculo das contas de água e esgoto no município e, em caso afirmativo, quais os motivos que influenciaram o recente aumento nas contas dos munícipes, com discriminação das taxas e percentuais aplicados, em razão de inúmeras reclamações da população sobre os grandes aumentos sofridos.", "nota": "Numeração ambígua na transcrição: ao ser lido na íntegra o requerimento é identificado como 'número 15, barra 2022', mas tanto no resumo do expediente quanto no momento da votação ele é chamado de 'requerimento número 14' — possível erro de leitura/transcrição, já que o número 14 já havia sido usado na sessão anterior (2022-08-15) para o requerimento sobre imóveis alugados. Mantido '015' por ser o número lido no texto integral do requerimento. Diretoria de destino não identificada nas diretorias oficiais listadas (o serviço de água e esgoto em Junqueirópolis pode ser prestado por autarquia própria, não mapeada na lista de diretorias fornecida)."}, {"tipo": "Indicação", "numero": "078", "data": "2022-08-29", "resumo": "Solicita sinalização de solo e adequação da canaleta (muito profunda) localizada na Rua Goiás com a Rua Amazonas, bairro Cristo Redentor, que tem causado danos a veículos.", "nota": "Nome do arquivo indica 2022-08-30, mas o texto afirma que o expediente é 'da 68ª Sessão Ordinária... a ser realizada em 29 de agosto de 2022' (segunda-feira); usada a data do texto."}, {"tipo": "Indicação", "numero": "082", "data": "2022-08-29", "resumo": "Solicita sinalização ou construção de depressões redutoras de velocidade em trechos próximos a creches e escolas: Rua Santos Dumont (próx. CEI Raio de Luz e Parque Ecológico Tafarel), ruas Dom Pedro II e Ipiranga (próx. CEI Sonho de Criança) e Avenida Campos Salles (próx. Escola Profº Idene Rodrigues dos Santos).", "nota": "Nome da escola na Avenida Campos Salles transcrito de forma confusa ('Escola Idene e Rodrigues do Santos'); interpretado como Escola Profº Idene Rodrigues dos Santos. Data da sessão: ver nota da indicação 078."}, {"tipo": "Requerimento", "numero": "016", "data": "2022-08-29", "resumo": "Solicita ao prefeito municipal informações sobre se a Lei Municipal nº 3.507, de 20 de abril de 2022, que dispõe sobre as normas de concessão e utilização do colar de girassol como símbolo de identificação das pessoas com deficiências ocultas, já está sendo aplicada no município e se foi regulamentada pelo Executivo Municipal; em caso afirmativo, solicita cópia da regulamentação para que os benefícios da lei sejam levados aos interessados.", "nota": "Diretoria de destino inferida (assunto trata de pessoas com deficiência), não foi explicitada no requerimento."}, {"tipo": "Denúncia", "numero": null, "data": "2022-09-06", "resumo": "Vereador relata reclamações recebidas da população sobre o atendimento do serviço de resgate/socorro municipal, citando o caso de uma cidadã (referida como 'de Cropla' ou nome de bairro assemelhado) cuja criança teve um mal súbito; a mensagem enviada ao secretário sobre o caso ainda não havia sido respondida. O vereador também mencionou, de forma confusa, situações de moradores intimados a prestar depoimento na delegacia após postagens sobre o tema nas redes sociais.", "nota": "O nome/local citado como 'cidadã de Cropla' não foi possível identificar com segurança (pode ser erro de transcrição de um bairro ou sobrenome). O trecho sobre moradores intimados pela delegacia após denúncias/reclamações contra a população ficou muito confuso na fala do vereador para render um registro separado com segurança; mantido apenas como contexto nesta nota."}, {"tipo": "Indicação", "numero": "088", "data": "2022-09-06", "resumo": "Reforçando a indicação nº 142/2021, de autoria de todos os vereadores, solicita a construção de redutores de velocidade em pontos estratégicos da Rua Santos Dumont, priorizando os bairros Alto do Cene, Jardim Paulista e Jardim das Américas, via preferencial com grande movimentação.", "nota": "Apresentada por 'todos os vereadores' conforme o texto; lista completa reconstituída a partir da composição da Câmara na 18ª Legislatura."}, {"tipo": "Denúncia", "numero": null, "data": "2022-09-13", "resumo": "Vereadores relatam denúncia/reclamação recebida da população sobre o tempo de atendimento da base comunitária de bombeiros/resgate em um caso concreto ocorrido no início de setembro, exposto pela família em rede social; o caso foi esclarecido em reunião com o secretário da Saúde e o sargento responsável pela base, que apresentou os horários do atendimento (chamada às 6h07, chegada em poucos minutos) e a família reconheceu o equívoco ao final, pedindo desculpas. O morador Daniel também foi mencionado como tendo recebido intimação da delegacia após comentar o caso no Facebook.", "nota": "Caso é continuação do tema tratado na sessão anterior (2022-09-06). A situação do morador Daniel, intimado pela delegacia após comentar o caso, ficou pouco clara quanto à motivação exata da intimação (se por difamação, ou por outro motivo); mantida apenas como contexto complementar."}, {"tipo": "Indicação", "numero": "093", "data": "2022-09-13", "resumo": "Reforçando a indicação 28/2021, de autoria da vereadora Teresinha de Lourdes Freitas Regodanso, solicita a construção, aluguel ou aquisição de um prédio para instalação de uma 'creche do idoso' (centro-dia), para atender famílias carentes que não têm onde deixar o idoso durante o período de trabalho.", "nota": "Contou também com apoio do vereador Elio Furini Neto conforme o texto lido, embora não conste como autor principal."}, {"tipo": "Indicação", "numero": "096", "data": "2022-09-13", "resumo": "Solicita que a ciclovia em construção no entorno do bairro Duas Barras receba o nome do saudoso senhor Gilmar Batista, pioneiro do ciclismo no município.", "nota": "Apresentada em apoio pelo vereador Reinaldo Codognato conforme o texto lido."}, {"tipo": "Requerimento", "numero": "017", "data": "2022-09-20", "resumo": "Requer o envio de ofício ao prefeito municipal solicitando informações sobre o andamento das atividades do viveiro de mudas municipal, considerando o termo de colaboração firmado com a Associação Agrícola de Junqueirópolis (Lei nº 3.489/2022) para a mudança do viveiro para o prédio da escola do bairro Duas Barras, que até então não havia sido efetivada.", "nota": "Na mesma sessão (2022-09-20), logo após a leitura deste requerimento, o vereador Anderson cobrou verbalmente explicação sobre o uso dos R$ 315 mil repassados à Associação Agrícola para a mudança do viveiro, tema ligado a este requerimento, mas sem numeração formal própria."}, {"tipo": "Indicação", "numero": "105", "data": "2022-09-27", "resumo": "Solicita a criação de um espaço, que poderia ser denominado Casa Lilás, para acolhimento de mulheres vítimas de violência doméstica e sexual, dada a fragilidade das vítimas e o risco de perseguição pelos agressores.", "nota": "Apresentada com apoio do vereador Elio Furini Neto conforme o texto lido."}, {"tipo": "Indicação", "numero": "125", "data": "2022-10-25", "resumo": "Solicita reajuste anual de 13% nos salários de todos os servidores públicos municipais (executivo e legislativo), a contar de 1º de janeiro de 2023, e o aumento do ticket alimentação para R$ 900,00, considerando a inflação acumulada e o reajuste de 3% não concedido em 2022.", "nota": "Assinada por todos os vereadores conforme o texto lido no expediente."}, {"tipo": "Denúncia", "numero": null, "data": "2022-11-01", "resumo": "Vereador relata denúncia recebida de uma moradora da Rua das Andorinhas: outra moradora teria ido até a porta de sua casa e jogado veneno na tentativa de envenenar seus cães (que sobreviveram por comerem apenas ração). A vítima teria fotografado a situação e identificado a suspeita, mas sem provas suficientes para formalizar a denúncia no momento.", "nota": "O vereador não citou nomes por já ter feito o alerta público na tribuna; não foi possível confirmar se houve registro formal de ocorrência policial sobre o caso."}, {"tipo": "Requerimento", "numero": "018", "data": "2022-11-16", "resumo": "Requer informações sobre os gastos dos recursos da conta 105.687-5, agência 09385 do Banco do Brasil, com origem em emenda parlamentar do deputado estadual, incluindo o investimento já realizado ou o planejamento para o investimento caso ainda não realizado.", "nota": "Diretoria de destino inferida pelo conteúdo (informações financeiras sobre conta bancária/emenda parlamentar); o requerimento não especifica expressamente a diretoria."}, {"tipo": "Denúncia", "numero": null, "data": "2022-11-21", "resumo": "O vereador Anderson Marcos Viana denunciou a retirada de aproximadamente mil caminhões de terra de um terreno público próximo ao campo de futebol do bairro Duas Barras, sem autorização da Câmara Municipal, alegando que o local era um antigo aterro sanitário/hospitalar com seringas, agulhas e resíduos médicos ainda não decompostos, configurando risco à saúde pública.", "nota": "O vereador afirma 'ter feito a denúncia' mas não especifica a qual órgão externo (delegacia, Ministério Público etc.) ela foi endereçada; parece, neste primeiro momento, tratar-se de denúncia formulada publicamente em tribuna."}, {"tipo": "Denúncia", "numero": null, "data": "2022-11-28", "resumo": "Anderson Marcos Viana retomou a denúncia da sessão anterior sobre a retirada de terra de possível aterro hospitalar em Duas Barras, contestando explicação do vereador Reinaldo Codognato (dada na sessão de 21/11) de que parte dessa terra teria sido usada na base do asfalto do Distrito Industrial IV. Classificou a hipótese como possível 'crime de peculato' caso confirmada, e cobrou apuração por se tratar de assunto de saúde pública.", "nota": "Continuação/atualização do caso registrado na sessão de 21/11/2022 (retirada de terra de possível aterro hospitalar em Duas Barras). Até o momento da fala, não havia confirmação oficial de que a terra tenha realmente sido usada na base do asfalto do Distrito Industrial IV."}, {"tipo": "Denúncia", "numero": null, "data": "2022-12-05", "resumo": "O resumo do expediente da sessão registrou o Ofício nº 31/2022 do Departamento Jurídico da Prefeitura, em resposta ao Ofício nº 119/2022 desta Casa, tratando de 'eventuais irregularidades relacionadas ao descarte e armazenamento de material médico' — aparente desdobramento formal, por via de ofício da Câmara ao setor Jurídico, do caso da terra de possível aterro hospitalar retirada em Duas Barras, denunciado por Anderson Marcos Viana nas sessões de 21/11 e 28/11/2022.", "nota": "O conteúdo do Ofício nº 31/2022 não foi lido na íntegra durante a sessão (apenas mencionado no resumo do expediente), portanto não há detalhe sobre a conclusão ou o teor da resposta jurídica. A ligação com o caso da terra/aterro hospitalar é inferida pelo tema ('descarte e armazenamento de material médico') e pela proximidade temporal com as falas de Anderson Marcos Viana nas duas sessões anteriores; não foi encontrada confirmação explícita no texto de que se trata do mesmo episódio."}, {"tipo": "Requerimento", "numero": null, "data": "2022-12-05", "resumo": "Requereu, na tribuna, a retirada de pauta do Projeto de Lei nº 66/2022 (termo de colaboração com a Associação Agrícola de Junqueirópolis para o viveiro municipal) e solicitou o plano de trabalho de 2022 do convênio, para comparação com o plano de trabalho proposto para 2023.", "nota": "Pedido verbal apresentado em tribuna, combinando retirada de pauta do PL 66/2022 com pedido de documento (plano de trabalho 2022), aprovado pelo plenário sem numeração formal de requerimento atribuída na sessão."}, {"tipo": "Indicação", "numero": "163", "data": "2022-12-12", "resumo": "Solicita a colocação de redutor de velocidade na Avenida Paulista, nas proximidades da Clínica Bem-Estar, em trecho de declive com histórico de acidentes e alta velocidade dos veículos.", "nota": "O texto integral desta indicação não foi lido/capturado na transcrição da sessão (a leitura das indicações seguiu direto de 162 para o texto correspondente à cesta de Natal, numerado '163' na fala do locutor). Resumo baseado no resumo do expediente. A numeração usada aqui (163) segue o resumo do expediente e a autoria (Teresinha e Reinaldo) mencionada por Teresinha em explicações pessoais mais adiante na mesma sessão, que trata do mesmo assunto (redutor de velocidade na Av. Paulista perto da Clínica Bem-Estar)."}, {"tipo": "Indicação", "numero": "164", "data": "2022-12-12", "resumo": "Solicita a concessão de uma cesta de Natal no valor de R$ 150,00 aos servidores públicos municipais, como forma de reconhecimento pelo trabalho prestado ao longo do ano.", "nota": "Na leitura integral da sessão, esta indicação foi anunciada pelo locutor como número '163' (um número a menos que no resumo do expediente, que a lista como 164). Mantido o número 164 do resumo do expediente, por ser a fonte de numeração oficial; o conteúdo (cesta de Natal, autoria de Valdir Aparecido de Oliveira) corresponde inequivocamente ao item 164 do expediente."}, {"tipo": "Indicação", "numero": "165", "data": "2022-12-12", "resumo": "Solicita a disponibilização de ao menos uma sala para atendimentos de fisioterapia no bairro Alto do Cene, já que os atendimentos hoje estão centralizados no bairro Vila Beatriz, obrigando pacientes idosos a longos deslocamentos.", "nota": "Na leitura integral da sessão, esta indicação foi anunciada pelo locutor como número '164' (um número a menos que no resumo do expediente, que a lista como 165). Mantido o número 165 do resumo do expediente, por ser a fonte de numeração oficial; o conteúdo (fisioterapia no Alto do Cene, autoria de Anderson Marcos Viana) corresponde inequivocamente ao item 165 do expediente."}, {"tipo": "Indicação", "numero": "003", "data": "2023-02-13", "resumo": "Solicita estudo junto ao setor competente da administração para adequar a iluminação dos playgrounds dos bairros Jardim Campo Belo e Jardim Primavera, locais frequentados por jovens e crianças que precisam de iluminação apropriada para lazer.", "nota": "O texto da sessão menciona repetidamente a data de 13 de fevereiro de 2023, enquanto o arquivo de transcrição está nomeado como 2023-02-14 (provável upload no YouTube um dia após a sessão). Usada a data do texto (2023-02-13)."}, {"tipo": "Indicação", "numero": "004", "data": "2023-02-13", "resumo": "Solicita estudo para providenciar um ônibus coletivo que percorra os bairros do município ao menos quatro vezes ao dia (7h às 11h e 13h às 17h30), cobrando tarifa acessível, para atender moradores sem meio próprio de condução, situação agravada em dias de chuva ou sol intenso.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-02-14, texto da sessão indica 13 de fevereiro de 2023."}, {"tipo": "Indicação", "numero": "005", "data": "2023-02-13", "resumo": "Solicita adequação dos bancos degradados da Rua Piauí, bairro Colina Verde, local com vista privilegiada do letreiro da cidade e da rodovia, bastante frequentado pela população.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-02-14, texto da sessão indica 13 de fevereiro de 2023."}, {"tipo": "Indicação", "numero": "006", "data": "2023-02-13", "resumo": "Solicita construção de uma canaleta de captação de águas pluviais no encontro da Rua da Amora com a Rua do Caju (bairro Figueira), para direcionar corretamente o fluxo de água e evitar alagamentos em terrenos e estruturas adjacentes.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-02-14, texto da sessão indica 13 de fevereiro de 2023."}, {"tipo": "Indicação", "numero": "007", "data": "2023-02-13", "resumo": "Solicita implementação de estacionamento a 45 graus na avenida da região da Rua Padre Miguel (área comercial em crescimento, com lojas, postos e clínicas), sem prejudicar o fluxo de trânsito, já que a via é larga.", "nota": "Nome da avenida transcrito de forma inconsistente: 'Avenida Geraldo Fudo' no resumo do expediente e algo como 'Avenida Geraldo Fud[o]' na leitura da indicação e na discussão em plenário, que a esclarece como sendo próxima à Rua Padre Miguel. Não foi possível confirmar a grafia exata do nome da avenida. Mesma observação de data do arquivo: transcrição nomeada 2023-02-14, texto da sessão indica 13 de fevereiro de 2023."}, {"tipo": "Indicação", "numero": "008", "data": "2023-02-13", "resumo": "Solicita reforma do Clube da Viola, localizado nas dependências do Recinto da ACERUVA, cujo mau estado vem deteriorando os instrumentos ali guardados, conforme relato dos próprios integrantes do clube.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-02-14, texto da sessão indica 13 de fevereiro de 2023."}, {"tipo": "Indicação", "numero": "009", "data": "2023-02-13", "resumo": "Solicita distribuição gratuita de material escolar para crianças da rede pública municipal de ensino, visando oportunidades iguais de estudo e economia às famílias carentes.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-02-14, texto da sessão indica 13 de fevereiro de 2023."}, {"tipo": "Requerimento", "numero": "02", "data": "2023-02-13", "resumo": "Requer informações ao prefeito municipal sobre o estado atual e os prazos de entrega da construção de duas salas de aula nos Centros Educacionais Infantis (CEIs) Raio de Luz, Nosso Teto e Sonho de Criança (despesas cobertas pela Lei Complementar Municipal nº 1027/2022), e solicita também informações sobre eventual previsão de ampliação futura do CEI Cristo Redentor, em razão do crescimento do número de crianças no bairro.", "nota": "Diretoria de destino inferida pelo assunto (construção de salas de aula em Centros Educacionais Infantis); poderia também envolver a Diretoria de Planejamento, Obras, Serviços e Manutenção, já que trata de execução de obra. O requerimento em si não nomeia expressamente a diretoria destinatária, sendo endereçado ao prefeito municipal."}, {"tipo": "Requerimento", "numero": "03", "data": "2023-02-13", "resumo": "Requer informações ao prefeito municipal sobre o encaminhamento de projeto de lei fixando o novo piso salarial dos professores do município de Junqueirópolis para 2023, no valor de R$ 4.420,55, tendo em vista que, até a data do requerimento, não havia sido protocolado o respectivo projeto de lei nesta Câmara (atualização da Lei Complementar nº 1024/2022).", "nota": "Diretoria de destino inferida pelo tema (piso salarial de professores); por se tratar de matéria salarial/orçamentária, poderia também ser direcionado à Diretoria de Fazenda, Compras, Almoxarifado e Recursos Humanos. O requerimento não especifica expressamente a diretoria."}, {"tipo": "Requerimento", "numero": "04", "data": "2023-02-13", "resumo": "Requer informações ao prefeito municipal sobre o encaminhamento de projeto de lei fixando o novo piso salarial dos agentes comunitários de saúde e agentes de combate às endemias, conforme fixado em 2022 pelo governo federal em dois salários mínimos (Emenda Constitucional nº 120/2022), tendo em vista que, até a data do requerimento, não havia sido protocolado o respectivo projeto de lei nesta Câmara (atualização da Lei Complementar nº 1040/2022).", "nota": "Diretoria de destino inferida pelo tema (piso salarial de agentes comunitários de saúde e de combate a endemias); por se tratar de matéria salarial, poderia também ser direcionado à Diretoria de Fazenda, Compras, Almoxarifado e Recursos Humanos. O requerimento não especifica expressamente a diretoria."}, {"tipo": "Indicação", "numero": "010", "data": "2023-02-22", "resumo": "Reforça a indicação nº 166/2022, solicitando intensificação do combate a escorpiões, aranhas e outros animais peçonhentos, e sugere nebulização (fumacê) nos bairros contra o mosquito da dengue, cujos casos voltaram a aumentar.", "nota": "O texto da sessão menciona repetidamente a data de 22 de fevereiro de 2023, enquanto o arquivo de transcrição está nomeado como 2023-02-23 (provável upload no YouTube um dia após a sessão). Usada a data do texto (2023-02-22)."}, {"tipo": "Indicação", "numero": "011", "data": "2023-02-22", "resumo": "Reforça a indicação nº 40/2022, solicitando manutenção ou substituição dos aparelhos de ginástica da Academia ao Ar Livre em frente ao estádio municipal Raphael Capelli, atualmente de madeira, quebrados ou incompletos, oferecendo risco aos usuários.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-02-23, texto da sessão indica 22 de fevereiro de 2023."}, {"tipo": "Indicação", "numero": "012", "data": "2023-02-22", "resumo": "Solicita reforma e ampliação da Academia de Judô Municipal, aproveitando o terreno ao lado do prédio inclusive para pista de skate, devido ao estado precário e ao pouco espaço relatado pelos pais dos praticantes.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-02-23, texto da sessão indica 22 de fevereiro de 2023."}, {"tipo": "Indicação", "numero": "013", "data": "2023-02-22", "resumo": "Solicita construção de uma cabine de transmissão no Ginásio de Esportes Cícero Gomes, já que as atuais são pequenas e obrigam as equipes de transmissão a ficarem expostas a acidentes com bolas durante os jogos.", "nota": "Indicação apresentada por todos os vereadores, conforme o texto ('assinado por todos os vereadores'). Mesma observação de data do arquivo: transcrição nomeada 2023-02-23, texto da sessão indica 22 de fevereiro de 2023."}, {"tipo": "Indicação", "numero": "014", "data": "2023-02-22", "resumo": "Reforça a indicação nº 57/2022, solicitando implantação de iluminação no trevo do bairro Duas Barras, associado pela população a acidentes, roubos e outras atividades ilícitas por falta de luz.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-02-23, texto da sessão indica 22 de fevereiro de 2023."}, {"tipo": "Indicação", "numero": "015", "data": "2023-02-22", "resumo": "Reforça a indicação nº 91/2022, solicitando reforma do playground e do calçamento da Praça do Centenário e construção de bebedouros no local, citando fios de energia expostos e playground danificado, com risco às crianças.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-02-23, texto da sessão indica 22 de fevereiro de 2023."}, {"tipo": "Indicação", "numero": "016", "data": "2023-02-22", "resumo": "Reforça a indicação nº 69/2022, solicitando instalação de bebedouros na praça do bairro Cristo Redentor e construção de sanitários públicos, masculino e feminino, no Parque Ecológico, locais de grande movimento sem essa infraestrutura.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-02-23, texto da sessão indica 22 de fevereiro de 2023."}, {"tipo": "Indicação", "numero": "017", "data": "2023-02-22", "resumo": "Solicita construção de um redutor de velocidade (lombada) no cruzamento da Rua José Bonifácio com a Avenida Junqueira, ponto de intenso fluxo de carros e pedestres próximo à Escola 13 de Junho e ao Colégio Objetivo, onde ocorreu acidente recente.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-02-23, texto da sessão indica 22 de fevereiro de 2023."}, {"tipo": "Indicação", "numero": "018", "data": "2023-02-22", "resumo": "Solicita implantação de faixas de pedestre, estacionamento exclusivo para deficientes físicos e idosos e, onde a via comportar, estacionamento a 45 graus em frente às igrejas católicas e evangélicas com sede própria, para maior segurança e comodidade em dias de missa e cultos.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-02-23, texto da sessão indica 22 de fevereiro de 2023."}, {"tipo": "Requerimento", "numero": "05", "data": "2023-02-22", "resumo": "Requer informações ao prefeito municipal acerca da execução dos contratos dos anos de 2021 e 2022 referentes às cessões de uso dos lotes do Distrito Industrial 3 e 4, para conhecimento sobre o cumprimento das obrigações da Prefeitura e das empresas (prazos, investimentos, geração de emprego etc.). Menciona requerimento semelhante do ano anterior (nº 12/2022), respondido apenas com cópias dos contratos (Ofício nº 68/2022).", "nota": "Diretoria de destino inferida pelo conteúdo (cessão de uso de lotes do Distrito Industrial); o requerimento não especifica expressamente a diretoria de destino, sendo endereçado ao prefeito municipal."}, {"tipo": "Indicação", "numero": "019", "data": "2023-02-27", "resumo": "Solicita substituição da iluminação pública da Avenida Junqueira, proximidades do Lar do Menor, onde árvores obstruem a luz e o local fica escuro e perigoso para pedestres, principalmente mulheres.", "nota": "O texto da sessão menciona repetidamente a data de 27 de fevereiro de 2023, enquanto o arquivo de transcrição está nomeado como 2023-02-28 (provável upload no YouTube um dia após a sessão). Usada a data do texto (2023-02-27)."}, {"tipo": "Indicação", "numero": "020", "data": "2023-02-27", "resumo": "Solicita melhorias e ampliação da captação de águas pluviais no encontro da Avenida Junqueira com a Rua da Paz (proximidades do Lar do Menor) e no encontro da Avenida Junqueira com a Rua José Bonifácio e a Avenida Campos Sales (proximidades do Colégio Objetivo), para evitar alagamentos em períodos de chuva forte.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-02-28, texto da sessão indica 27 de fevereiro de 2023."}, {"tipo": "Indicação", "numero": "021", "data": "2023-02-27", "resumo": "Solicita revisão geral em todos os parques, praças e playgrounds do município, para oferecer lazer seguro e gratuito às famílias e ocupar o tempo ocioso dos jovens.", "nota": "Apresentada pelo vereador Rui Domingos da Silva, com apoio do vereador Reinaldo Codognato, conforme assinatura no texto. Mesma observação de data do arquivo: transcrição nomeada 2023-02-28, texto da sessão indica 27 de fevereiro de 2023."}, {"tipo": "Indicação", "numero": "022", "data": "2023-02-27", "resumo": "Reforça a indicação nº 21/2022, solicitando aquisição de uma moto Fumacê para auxiliar no combate à dengue, chikungunya, pernilongos e demais insetos nocivos, diante do aumento de casos e do crescimento da cidade.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-02-28, texto da sessão indica 27 de fevereiro de 2023."}, {"tipo": "Requerimento", "numero": "06", "data": "2023-02-27", "resumo": "Requer, dirigido diretamente ao diretor de saúde municipal, informações sobre a forma como se dão os contratos dos profissionais que lecionam aulas de zumba e de defesa pessoal para os munícipes, detalhando os prazos de vencimento e se os profissionais recebem algum subsídio/remuneração para desempenhar tais atividades, solicitando que sejam anexadas cópias dos contratos mencionados.", "nota": "Requerimento dirigido diretamente ao diretor de saúde municipal (não ao prefeito). Na sessão seguinte (07/03/2023), o vereador Anderson Marcos Viana fez referência a esse requerimento durante um desentendimento em tribuna com o secretário de Saúde, mencionando que a resposta havia sido dada por escrito, mas sem detalhar o conteúdo."}, {"tipo": "Denúncia", "numero": null, "data": "2023-03-06", "resumo": "Durante discussão sobre um requerimento anterior de sua autoria (que pedia explicações sobre o pagamento de professores de zumba e defesa pessoal), o vereador Anderson Marcos Viana relatou publicamente, em tom de confronto, que o secretário de Saúde, Israel Gumieiro, o havia questionado pessoalmente sobre a origem do dinheiro usado para pagar esses professores. Em resposta, Anderson insinuou na tribuna um episódio anterior não detalhado em que o secretário teria 'agredido' e 'dado um chute' em uma senhora, afirmando nunca ter questionado publicamente esse fato antes, e alertou o secretário a 'cuidar de suas próprias casas'.", "nota": "Alegação grave e vaga, feita em tom de confronto pessoal na tribuna, sem menção de data, local, nome da suposta vítima ou de qualquer registro formal (boletim de ocorrência, processo, ofício). Não há confirmação, no texto revisado, de que esse episódio tenha sido levado adiante formalmente (não foi identificado requerimento, denúncia formal ou ofício tratando especificamente deste caso). Recomenda-se cautela na publicação por se tratar de acusação não comprovada contra servidor público nomeado; sugere-se revisão humana antes de divulgar."}, {"tipo": "Indicação", "numero": "023", "data": "2023-03-06", "resumo": "Solicita locação de um imóvel para atender à demanda de crianças que precisam frequentar o Centro Educacional Infantil (CEI) do bairro Cristo Redentor, já que crianças estão sendo transferidas para outras unidades por falta de espaço.", "nota": "O texto da sessão menciona repetidamente a data de 6 de março de 2023, enquanto o arquivo de transcrição está nomeado como 2023-03-07 (provável upload no YouTube um dia após a sessão). Usada a data do texto (2023-03-06)."}, {"tipo": "Indicação", "numero": "024", "data": "2023-03-06", "resumo": "Solicita estudo, junto à assessoria jurídica e ao setor de pessoal, para incluir no Estatuto dos Servidores Públicos Municipais uma forma de compensar (com folga ou outra opção) os servidores mensalistas nos meses com 31 dias, já que o cálculo salarial e de férias considera sempre 30 dias, gerando perda de um dia de remuneração.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-03-07, texto da sessão indica 6 de março de 2023."}, {"tipo": "Indicação", "numero": "025", "data": "2023-03-06", "resumo": "Solicita recapeamento asfáltico de trecho da Rua Vitor Junqueira (entre as ruas Zeca da Cunha e Washington Luiz) e da Avenida Junqueira (entre a Rua Sebastiana de Oliveira e o Jardim dos Pássaros), degradados pelas fortes chuvas recentes.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-03-07, texto da sessão indica 6 de março de 2023."}, {"tipo": "Indicação", "numero": "026", "data": "2023-03-06", "resumo": "Solicita construção de um salão comunitário no bairro Vila Beatriz, junto ao vestiário já existente, e que o espaço seja cercado, para uso da população em festas, palestras e lazer.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-03-07, texto da sessão indica 6 de março de 2023."}, {"tipo": "Indicação", "numero": "027", "data": "2023-03-06", "resumo": "Solicita substituição dos brinquedos de madeira do playground do bairro Jardim Alvorada, que oferecem risco às crianças, e reabertura do banheiro do local, fechado há aproximadamente cinco anos sem uso.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-03-07, texto da sessão indica 6 de março de 2023."}, {"tipo": "Indicação", "numero": "028", "data": "2023-03-06", "resumo": "Solicita a realização do programa 'Domingo no Bairro' no bairro Alto do Cene, que não recebe o evento há alguns meses, incluindo exames preventivos de saúde, incentivo a atividades físicas, recreação infantil e serviços de cidadania gratuitos.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-03-07, texto da sessão indica 6 de março de 2023."}, {"tipo": "Indicação", "numero": "029", "data": "2023-03-06", "resumo": "Solicita que as futuras instalações do complexo de saúde do município recebam o nome do saudoso Jorge Yochinobu Chihara, farmacêutico nascido em Junqueirópolis, ex-secretário municipal de saúde de Junqueirópolis e Adamantina e ex-diretor do Departamento Regional de Saúde (DRS 11).", "nota": "Apresentada pelo vereador Reinaldo Codognato com apoio dos vereadores Rui Domingos da Silva e Valdir Aparecido de Oliveira, conforme assinaturas no texto. Mesma observação de data do arquivo: transcrição nomeada 2023-03-07, texto da sessão indica 6 de março de 2023."}, {"tipo": "Indicação", "numero": "030", "data": "2023-03-06", "resumo": "Solicita intensificação da fiscalização nas estradas rurais municipais com base na Lei Municipal nº 1921/97, para coibir a obstrução do escoamento de águas pluviais por maquinário de empresas terceirizadas durante a manutenção das estradas, garantindo o tráfego mesmo em períodos de chuva.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-03-07, texto da sessão indica 6 de março de 2023."}, {"tipo": "Denúncia", "numero": null, "data": "2023-03-13", "resumo": "O vereador relatou o caso de uma senhora idosa (referida como 'Dona Bela'), moradora da Rua Belo Horizonte, próximo ao Campo da Curitiba, cuja casa apresenta rachaduras e o chão afundado, estando sustentada apenas pela tesoura da estrutura de madeira, em risco de desabamento. Segundo o vereador, o caso já havia sido comunicado aos setores responsáveis da administração há cerca de 22 a 30 dias; uma equipe da Defesa Civil teria ido ao local, tirado três fotos e não retornado, sem solução até a data da sessão.", "nota": "Diretoria de destino inferida (situação de vulnerabilidade habitacional de idosa), podendo também envolver a Diretoria de Planejamento, Obras, Serviços e Manutenção (risco estrutural do imóvel) e a Defesa Civil, mencionada nominalmente pelo vereador como já acionada. Caso segue sendo mencionado nas sessões seguintes (ver denúncia da sessão de 20/03/2023 sobre o mesmo assunto)."}, {"tipo": "Denúncia", "numero": null, "data": "2023-03-13", "resumo": "Moradores do loteamento Recanto do Eucalipto relataram ao vereador prejuízos materiais (perda de alimentos, geladeira e outros bens, danos a contenções de pneus) causados por fortes chuvas e enxurradas no final de semana anterior à sessão. Segundo o vereador, moradores atingidos tentaram contato com a administração sem retorno, e ninguém do poder público havia comparecido ao local até o momento de sua fala em plenário.", "nota": "Caso segue sendo discutido nas sessões seguintes; na sessão de 20/03/2023, o presidente da Câmara e outro vereador esclareceram que a Defesa Civil foi de fato acionada na noite dos fatos e que houve contato com moradores do bairro. Diretoria de destino inferida pelo tema (escoamento de águas pluviais/infraestrutura do loteamento)."}, {"tipo": "Denúncia", "numero": null, "data": "2023-03-13", "resumo": "O vereador relatou o caso de uma moradora da Avenida Bandeirante com a Rua Tiradentes (próximo ao antigo prédio da Igreja Assembleia de Deus), cuja casa vem sendo destruída há cerca de 12 anos pelo escoamento de água pluvial proveniente de um terreno público, tendo já perdido três muros e parte da residência. Segundo o vereador, a moradora chegou a acionar a Justiça contra a administração municipal para tentar reparação, mas perdeu a ação.", "nota": "Situação de longa data (cerca de 12 anos) e com desfecho judicial desfavorável à moradora já mencionado pelo vereador; não há indicação de que providências tenham sido tomadas na sequência das sessões analisadas neste lote. Recomenda-se cautela por envolver processo judicial não detalhado (partes, número do processo)."}, {"tipo": "Requerimento", "numero": "07", "data": "2023-03-13", "resumo": "Requer envio de ofício ao prefeito municipal solicitando informações sobre a esperada pavimentação (asfaltamento) da estrada vicinal que liga Junqueirópolis a Dracena, com apresentação de documentos comprobatórios (assinatura de convênio, licitação da empresa contratada etc.), tendo em vista sucessivos anúncios públicos da obra desde o ano anterior sem início efetivo.", "nota": "Diretoria de destino inferida pelo assunto (execução de obra viária); o requerimento também envolve convênio estadual, podendo tangenciar a Diretoria de Licitações, Contratos e Convênios. Data do arquivo de origem (2023-03-14) diverge da data mencionada no texto (13 de março de 2023); usada a data do texto, consistente com o padrão identificado nas indicações do mesmo lote."}, {"tipo": "Denúncia", "numero": null, "data": "2023-03-20", "resumo": "O vereador reiterou o caso da senhora idosa ('Dona Bela'), da Rua Belo Horizonte, cuja casa segue com risco de desabamento (chão afundado, rachaduras), informando que já se passaram entre 33 e 35 dias desde o primeiro pedido de providências, sem solução até o momento; relatou novamente que a Defesa Civil esteve no local, tirou fotos e não retornou.", "nota": "Continuidade do caso já relatado na sessão de 13/03/2023 (90ª sessão ordinária), sem solução até a data desta sessão."}, {"tipo": "Denúncia", "numero": null, "data": "2023-03-20", "resumo": "O vereador cobrou, pela terceira vez em plenário, providências sobre a ponte do Córrego do Fogo, na estrada rural que liga Junqueirópolis a Flora Rica, que teria caído há aproximadamente 10 anos; segundo o vereador, a estrada municipal no local está tomada por mato e cercas, dificultando o acesso.", "nota": "Vereador afirmou já ter cobrado o mesmo assunto em pelo menos duas sessões anteriores, não identificadas neste lote."}, {"tipo": "Denúncia", "numero": null, "data": "2023-03-20", "resumo": "O vereador relatou o caso de uma chácara na região da Chácara Santa Ruth (citado o nome 'Alberto Nucci' e o proprietário como 'seu Reginaldo'), próxima ao local conhecido como 'Pontilhão', onde a erosão causada por enxurradas estaria destruindo parte da propriedade, incluindo viveiros/lagoas de peixes. Segundo o vereador, tentativas de contato com o setor responsável da administração, feitas por telefone e mensagens, não obtiveram retorno após quatro ou cinco tentativas.", "nota": "Localização do imóvel e nome do proprietário mencionados de forma imprecisa/coloquial pelo vereador na fala; recomenda-se confirmação antes de publicação, se necessário identificar o local com mais precisão."}, {"tipo": "Denúncia", "numero": null, "data": "2023-03-20", "resumo": "O vereador afirmou ter apresentado formalmente uma denúncia, já encaminhada à Promotoria de Justiça, questionando a legalidade de obras realizadas na área da antiga linha férrea (praça, jardins, pergolados, aparelhos de ginástica) sem que o investimento de recursos públicos tivesse sido submetido à aprovação da Câmara Municipal, alegando desconhecer qualquer documentação que autorizasse tais gastos.", "nota": "Vereador não apresentou em plenário a documentação da denúncia à Promotoria nem detalhou valores ou datas específicas; presidente da Câmara respondeu de forma genérica, afirmando que a Casa agiria dentro da lei se necessário. Recomenda-se cautela e verificação adicional antes de publicação, por se tratar de acusação de possível irregularidade administrativa sem comprovação apresentada na sessão."}, {"tipo": "Requerimento", "numero": null, "data": "2023-03-20", "resumo": "Durante as explicações pessoais, a vereadora comentou sobre a indicação de iluminação da Avenida Rio Branco e mencionou que a troca das lâmpadas de vapor de sódio por LED (autorizada pela Lei Complementar nº 1.080/2023) havia começado em sua rua, mas foi interrompida. Em seguida, sugeriu verbalmente que a Câmara fizesse um requerimento à Prefeitura para saber sobre o cumprimento dessa lei e sobre a substituição das lâmpadas em todo o município.", "nota": "A vereadora apenas sugeriu verbalmente, durante as explicações pessoais, que a Casa fizesse um requerimento sobre o tema ('eu gostaria, se fosse possível, dessa casa de lei fazer um requerimento'); a transcrição não registra leitura formal de um requerimento numerado nem votação sobre o assunto nesta sessão. Não foi possível confirmar, no texto revisado, se esse pedido foi de fato formalizado e votado em sessão posterior às analisadas neste lote."}, {"tipo": "Denúncia", "numero": null, "data": "2023-03-27", "resumo": "O vereador relatou que uma criança deu entrada no pronto-socorro municipal (Santa Casa) com quadro respiratório grave e não foi avaliada pessoalmente pelo médico pediatra de plantão, que teria orientado apenas o encaminhamento da criança à UTI móvel ('cross') sem exame direto; a criança teria permanecido na fila de espera da UTI móvel por mais de um dia. Segundo o vereador, o mesmo tipo de situação ocorreu duas vezes na mesma semana.", "nota": "O presidente da Câmara se comprometeu, ainda durante a sessão, a encaminhar ofício à Armandade da Santa Casa de Misericórdia de Junqueirópolis solicitando explicações sobre o caso. Não foi identificada, nas sessões seguintes analisadas neste lote, resposta formal a esse pedido."}, {"tipo": "Denúncia", "numero": null, "data": "2023-03-27", "resumo": "O vereador relatou que a água proveniente da área do cemitério municipal (recentemente ampliada) está causando erosão que já destruiu metade de um sítio vizinho, de propriedade de um morador não identificado pelo nome ('o rapaz que mora do lado'). Segundo o vereador, havia sido combinado verbalmente com a administração a construção de um muro de contenção para impedir o escoamento da água para o sítio, o que não foi cumprido, e a erosão segue avançando.", "nota": "Vereador não identificou o proprietário do sítio pelo nome nem apresentou documentação; recomenda-se cautela e, se possível, confirmação adicional antes de publicação."}, {"tipo": "Requerimento", "numero": "08", "data": "2023-03-27", "resumo": "Requer envio de ofício ao prefeito municipal solicitando informações sobre o início das obras de recuperação e adequação da estrada rural municipal JQL 030 (trecho Junqueirópolis–Irapuru, sentido bairro Cafezinho), no valor de R$ 2.141.105,43, previstas para iniciar em junho de 2022 pelo programa estadual 'Melhor Caminho' (Decreto nº 41.721/1997) e que, até a data do requerimento, ainda não haviam sido iniciadas.", "nota": "Na mesma sessão foi lido e aprovado também o Requerimento nº 09/2023, de autoria de todos os vereadores, com votos de condolências pelo falecimento do ex-prefeito Hélio Aparecido Mendes Furini; este não foi incluído no arquivo por se tratar, em substância, de moção de pesar (endereçada à família do falecido, sem pedido de informações/providências a diretoria ou órgão), conforme instrução de excluir moções."}, {"tipo": "Denúncia", "numero": null, "data": "2023-04-03", "resumo": "O vereador apontou uma área verde na Rua Constantino Marcolino de Souza, próxima ao parque ecológico, como foco de proliferação do mosquito da dengue, com acúmulo de garrafas PET e outros recipientes trazidos pela água de bueiros, em mata fechada que dificulta a limpeza pelos serviços municipais.", "nota": "Contexto de crise de dengue no município relatado ao longo de várias sessões deste lote, incluindo duas mortes de crianças mencionadas na mesma sessão."}, {"tipo": "Requerimento", "numero": null, "data": "2023-04-03", "resumo": "Ofício especial coletivo assinado por todos os vereadores, endereçado ao Diretor de Saúde, solicitando que seja estudada a possibilidade de implantar um centro de triagem e hidratação para casos de dengue, com o objetivo de conter o avanço da doença no município, prestar assistência aos pacientes e desafogar o pronto-socorro municipal e as Estratégias de Saúde da Família (ESFs) dos bairros.", "nota": "Apresentado pelo presidente da Câmara como 'ofício especial' assinado coletivamente por todos os vereadores, e não como requerimento numerado submetido a discussão e votação em plenário; por isso classificado como não formalizado nos moldes regimentais dos demais requerimentos, embora tenha sido lido oficialmente em sessão e encaminhado à Diretoria de Saúde."}, {"tipo": "Requerimento", "numero": "11", "data": "2023-04-03", "resumo": "Requer envio de ofício ao prefeito municipal solicitando informações sobre descontos ocorridos no pagamento do salário de diversos professores da rede municipal de ensino infantil (Centros Educacionais Infantis, CIs), justificados pela administração como erro no sistema no pagamento do mês anterior; segundo o vereador autor, cerca de 62 funcionários foram afetados, com descontos entre R$ 92,38 e R$ 395,81.", "nota": "Diretoria de destino inferida pelo tema (folha de pagamento/descontos salariais); por tratar de professores dos CIs, também poderia envolver a Diretoria de Educação, Cultura, Esportes, Lazer e Turismo. O requerimento não especifica expressamente a diretoria destinatária."}, {"tipo": "Denúncia", "numero": null, "data": "2023-04-10", "resumo": "O vereador apresentou, com base em documentos da licitação, um histórico de três adiamentos sucessivos do prazo de execução da obra de pavimentação asfáltica da Rua Chapéu de Couro (licitação vencida em 22/08/2022, com prazos adiados para dezembro/2022, fevereiro/2023 e abril/maio/2023), sem que a obra tivesse sido iniciada até a data da sessão. O vereador insinuou que o atraso poderia ser proposital, para que a obra seja iniciada perto do período eleitoral de 2024.", "nota": "Vereador afirmou possuir toda a documentação dos adiamentos, mas não a anexou/leu integralmente em plenário; menção a uma possível relação com um vídeo de cobrança feito por moradores é apresentada pelo próprio vereador como especulação ('não sei se é'). Recomenda-se cautela por se tratar de acusação de possível motivação política não comprovada."}, {"tipo": "Denúncia", "numero": null, "data": "2023-04-10", "resumo": "O vereador relatou, após visita ao local com o projeto da obra em mãos, que a pavimentação da via de acesso João Furini não foi executada conforme o projeto: um trecho previsto (próximo ao campo de futebol) não teria sido asfaltado pela empresa contratada, que já havia sido paga em R$ 100.388,40 e havia deixado o local. O vereador questionou se a empresa retornaria para concluir o serviço.", "nota": "Diretamente relacionada ao Requerimento nº 13/2023, registrado no arquivo de requerimentos deste mesmo lote, apresentado na mesma sessão para formalizar o pedido de esclarecimentos."}, {"tipo": "Denúncia", "numero": null, "data": "2023-04-10", "resumo": "A vereadora Marisa Alves da Silva Costa foi vítima de um golpe de identidade: pessoa(s) não identificada(s) utilizaram sua imagem para enviar mensagens via WhatsApp a terceiros pedindo dinheiro em seu nome. A vereadora registrou boletim de ocorrência na delegacia no mesmo dia. O fato foi relatado em plenário pelo presidente da Câmara, em nome da vereadora, que estava ausente da sessão por estar com dengue.", "nota": "Campo 'vereadores' deixado vazio por se tratar de caso relatado por terceiro (o presidente da Câmara) em nome da vereadora Marisa Alves da Silva Costa, que foi a vítima do golpe, e não estava presente na sessão para relatar pessoalmente. Campo 'direcionada_a' não se aplica por não se tratar de cobrança a diretoria/órgão municipal, e sim de um crime relatado à população como alerta."}, {"tipo": "Requerimento", "numero": "12", "data": "2023-04-10", "resumo": "Requer envio de ofício ao prefeito municipal solicitando informações sobre o andamento das obras previstas no Plano de Desenvolvimento Municipal (PDM) de 2021 para dar fim aos transtornos causados pelo chamado 'buracão' aos moradores do Jardim Paulista, especialmente em períodos de fortes chuvas.", "nota": "O tema já vinha sendo cobrado verbalmente havia semanas; na sessão de 27/03/2023 (92ª sessão), o presidente da Câmara relatou ter recebido uma ligação de um morador do Jardim Paulista questionando sobre o buraco e informou que a Casa encaminharia um requerimento ao Executivo a respeito, o que se concretizou neste requerimento nº 12/2023."}, {"tipo": "Requerimento", "numero": "13", "data": "2023-04-10", "resumo": "Requer envio de ofício ao prefeito municipal solicitando informações detalhadas sobre o andamento das obras de pavimentação na via de acesso João Furini, incluindo data de término e metragem asfaltada, após o vereador constatar, em visita ao local com o projeto em mãos, que parte do trecho previsto (próximo ao campo de futebol) não havia sido pavimentado pela empresa contratada, apesar de já ter sido pago o valor de R$ 100.388,40.", "nota": "Ver também denúncia relacionada, registrada no arquivo de denúncias deste mesmo lote, sobre a suspeita de execução incompleta da obra apesar do pagamento já efetuado."}, {"tipo": "Requerimento", "numero": "14", "data": "2023-04-10", "resumo": "Requer envio de ofício ao prefeito municipal solicitando informações sobre a existência de recursos próprios ou dotação no orçamento vigente que possam ser utilizados para a contratação de segurança privada e aquisição de equipamentos de segurança (como detectores de metais), visando maior segurança nas escolas e Centros Educacionais Infantis (CEIs) do município, tendo em vista o interesse da Câmara em elaborar projeto de lei sobre o tema após nova onda de ataques em escolas no país.", "nota": "Diretoria de destino inferida pelo tema (contratação de segurança/equipamentos); por envolver diretamente escolas e CIs, também poderia ser direcionado à Diretoria de Educação, Cultura, Esportes, Lazer e Turismo. O requerimento não especifica expressamente a diretoria destinatária."}, {"tipo": "Denúncia", "numero": null, "data": "2023-04-17", "resumo": "O vereador relatou que diversos funcionários aprovados no concurso de auxiliar de serviços de educação estão sendo realocados para exercer funções de escriturário, impedindo a convocação de novos escriturários aprovados em concurso específico para esse cargo e deixando CIs com falta de auxiliares. Segundo o vereador, um funcionário da educação com problema de saúde que buscou judicialmente a recondução a outro setor teve o pedido contestado pela administração, que perdeu a ação (indenização citada de R$ 50 mil) e recorreu novamente, com nova derrota esperada pelo vereador.", "nota": "Diretamente relacionada ao Requerimento nº 15/2023, registrado no arquivo de requerimentos deste mesmo lote, apresentado na mesma sessão. Vereador não identificou nominalmente o funcionário mencionado no caso judicial, preservando sua identidade; recomenda-se manter assim na publicação."}, {"tipo": "Denúncia", "numero": null, "data": "2023-04-17", "resumo": "O vereador criticou a reforma da sala de espera da rodoviária municipal, que já completava um ano de execução com gasto aproximado de R$ 250 mil, afirmando que o serviço da empresa contratada teria se limitado ao forro e a uma pintura externa, enquanto a pintura interna e o paisagismo/jardim teriam sido feitos por funcionários da própria prefeitura. O vereador especulou que a inauguração da obra seria propositalmente adiada para próximo do período eleitoral de 2024.", "nota": "Valores e prazos citados de memória pelo vereador em tom de crítica política, sem apresentação de documentos na sessão; recomenda-se cautela e, se possível, confirmação dos valores antes de publicação."}, {"tipo": "Denúncia", "numero": null, "data": "2023-04-17", "resumo": "Os vereadores cobraram o cumprimento de uma promessa pública feita pela administração há cerca de dois anos, durante a inauguração de uma praça no Jardim Paulista, de instalação de uma faixa elevada (lombofaixa) próxima à praça e a um Centro Educacional Infantil do bairro, o que ainda não havia sido cumprido até a data da sessão.", "nota": "Relacionada à indicação nº 71/2023, dos mesmos vereadores, apresentada nesta mesma sessão, solicitando lombofaixa no encontro das ruas Dom Pedro II e Porto Alegre, próximo à SEI Sonho de Criança (Jardim Paulista)."}, {"tipo": "Requerimento", "numero": "15", "data": "2023-04-17", "resumo": "Requer envio de ofício ao prefeito municipal solicitando informações sobre quantos funcionários, servidores temporários e efetivos, estão contratados ou prestando serviço no setor da educação, bem como onde estão alocados/prestando serviço, diante de relatos, colhidos em visitas a Centros Educacionais Infantis (CEIs), de falta de auxiliares de educação e de suspeita de desvio de função (auxiliares de educação ocupando vagas de escriturário).", "nota": "Ver também denúncia relacionada, registrada no arquivo de denúncias deste mesmo lote, sobre o suposto desvio de função de auxiliares de educação e seu impacto financeiro em ações judiciais perdidas pelo município."}, {"tipo": "Indicação", "numero": "073", "data": "2023-04-24", "resumo": "Solicita estudo junto ao setor competente para dar prioridade nos atendimentos das Estratégias de Saúde da Família (ESFs) para crianças e idosos, grupos com maior vulnerabilidade e dificuldade de aguardar atendimento.", "nota": "O texto da sessão menciona repetidamente a data de 24 de abril de 2023 como data da 96ª Sessão Ordinária (inclusive a ata da sessão anterior, do dia 17/04, e a antecipação da sessão seguinte para 2 de maio devido ao feriado de 1º de maio), enquanto o arquivo de transcrição está nomeado como 2023-04-25 (provável upload no YouTube um dia após a sessão real). Usada a data do texto (2023-04-24)."}, {"tipo": "Indicação", "numero": "074", "data": "2023-04-24", "resumo": "Solicita estudo para cobrir o espaço cimentado localizado no Centro Educacional Infantil (CEI) Sonho de Criança, na esquina das ruas Ipiranga e Porto Alegre, para proteger e dar comodidade às crianças em dias de chuva e permitir o uso do espaço para atividades de recreação, reuniões com pais e festividades.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-04-25, texto da sessão indica 24 de abril de 2023."}, {"tipo": "Indicação", "numero": "075", "data": "2023-04-24", "resumo": "Solicita estudo para realizar a manutenção do telhado da rodoviária municipal, em razão de infiltrações em alguns pontos do local que ocasionam goteiras e podem trazer riscos aos usuários do transporte público.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-04-25, texto da sessão indica 24 de abril de 2023."}, {"tipo": "Indicação", "numero": "076", "data": "2023-04-24", "resumo": "Solicita estudo para realizar a manutenção da ponte do Córrego Palmeiras, localizada no bairro Segunda Seção, que faz divisa entre os municípios de Junqueirópolis e Dracena, além da manutenção da estrada de acesso, importante para o escoamento da produção agrícola e para os moradores do bairro.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-04-25, texto da sessão indica 24 de abril de 2023."}, {"tipo": "Requerimento", "numero": "016", "data": "2023-04-24", "resumo": "Requer informações acerca de quais medicamentos são fornecidos pelo Sistema Único de Saúde (SUS) e quais são fornecidos pela Secretaria da Saúde (fora da grade de fornecimento do SUS), além do valor gasto com esses medicamentos.", "nota": "A resposta (Ofício nº 98/2023, mencionado no expediente da sessão de 15/05/2023) forneceu informações sobre os medicamentos do SUS, mas o conteúdo detalhado não foi lido integralmente em plenário nas sessões deste lote."}, {"tipo": "Requerimento", "numero": "017", "data": "2023-04-24", "resumo": "Requer informações acerca da reforma realizada na rodoviária municipal: motivo de não ter sido finalizada mesmo após um ano do início, explicações sobre as infiltrações no telhado, motivo do bebedouro não ter sido reformado e quais as previsões de entrega da obra.", "nota": "Vereadores relataram, nas sessões seguintes (99ª e 100ª), que este requerimento seguia sem resposta da administração meses após o prazo legal de 15 dias, chegando a cogitar medidas judiciais."}, {"tipo": "Requerimento", "numero": "018", "data": "2023-04-24", "resumo": "Requer informações acerca de quais os procedimentos e soluções foram tomados pela Defesa Civil em relação à residência da senhora Bela Arbina Consolaro, na Rua Belo Horizonte, 1969, bairro Jardim Junqueirópolis, que permanecia na mesma situação de risco meses após a visita da Defesa Civil.", "nota": "A Defesa Civil não corresponde diretamente a nenhuma das nove diretorias oficiais listadas; diretoria de destino inferida por tratar de questão estrutural/de obras. Nas sessões seguintes, vereadores relataram que este requerimento também seguia sem resposta da administração."}, {"tipo": "Indicação", "numero": "077", "data": "2023-05-02", "resumo": "Solicita estudo para utilizar drones no combate à dengue, facilitando a identificação de focos do mosquito em locais de difícil acesso (imóveis vazios, telhas, lajes) e o mapeamento de criadouros como caixas d'água, sem substituir as inspeções semanais regulares.", "nota": "O texto da sessão indica repetidamente a data de 2 de maio de 2023 como data da 97ª Sessão Ordinária, enquanto o arquivo de transcrição está nomeado como 2023-05-03 (provável upload no YouTube um dia após a sessão real). Usada a data do texto (2023-05-02)."}, {"tipo": "Indicação", "numero": "078", "data": "2023-05-02", "resumo": "Solicita a realização de diversas benfeitorias no Centro Educacional Infantil (CEI) Raio de Luz: instalação de câmeras, cobertura no espaço lateral já cimentado (nos moldes do já pedido para o CEI Sonho de Criança), construção de banheiros e bebedouros para o novo bloco, coberturas ligando as novas salas ao bloco principal, coberturas na entrada e saída dos alunos, e fechamento (muro ou cerca) da abertura feita recentemente no muro, hoje fechada apenas com uma placa de madeira.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-05-03, texto da sessão indica 2 de maio de 2023."}, {"tipo": "Indicação", "numero": "079", "data": "2023-05-02", "resumo": "Solicita a manutenção do telhado, ou a troca de algumas telhas, do barracão do recinto da ACERUVA, onde ocorrem atividades de ginástica, em razão da preocupação com a segurança dos frequentadores e das fortes chuvas que têm impedido o uso do local.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-05-03, texto da sessão indica 2 de maio de 2023."}, {"tipo": "Indicação", "numero": "080", "data": "2023-05-02", "resumo": "Solicita o retorno dos atendimentos odontológicos nas escolas municipais, com intervalo de um mês entre cada consulta, para identificação precoce de problemas de saúde bucal e orientação das famílias.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-05-03, texto da sessão indica 2 de maio de 2023."}, {"tipo": "Requerimento", "numero": "019", "data": "2023-05-02", "resumo": "Requer prestação de contas detalhada acerca da realização da ACERUVA (ACERUVA) no ano de 2022, com a apresentação das notas fiscais das respectivas despesas.", "nota": "Diretoria de destino inferida pelo conteúdo financeiro/prestação de contas do pedido; o requerimento não especifica expressamente a diretoria. A resposta (Ofício nº 97/2023, citado no expediente da sessão de 08/05/2023) prestou as contas solicitadas, mas seu conteúdo integral não foi lido em plenário nas sessões deste lote."}, {"tipo": "Requerimento", "numero": "020", "data": "2023-05-02", "resumo": "Requer informações acerca da realização de cálculo do impacto que a fixação do piso salarial da enfermagem terá nas contas públicas municipais e, sendo positiva a resposta, o valor desse impacto e se já foram tomadas providências junto ao governo federal para viabilizar o repasse do auxílio federal.", "nota": "A resposta (Ofício DJ nº 17/2023, lido na sessão de 15/05/2023) informou que a implantação do piso da enfermagem não causará impacto nas contas da Prefeitura, em razão dos recursos recebidos da União."}, {"tipo": "Requerimento", "numero": "021", "data": "2023-05-02", "resumo": "Em complemento ao requerimento nº 11/2023 (respondido pelo Ofício nº 80/2023), solicita esclarecimentos complementares sobre o parâmetro de cálculo utilizado pelo RH para o pagamento dos professores de Educação Básica I (rubrica 'DIF A1' no contracheque), diante de divergências e acréscimos identificados na competência de fevereiro/2023, e como é feito o cálculo da remuneração desses professores conforme a Lei Municipal nº 1.024/2022 (piso) e o plano de carreira do magistério.", "nota": "Diretoria de destino inferida por se tratar de cálculo de folha de pagamento (RH); o requerimento também tem forte relação com a Diretoria de Educação. Na sessão de 15/05/2023 a resposta (Ofício nº 61/2023) foi lida como recebida, mas o vereador Elio Furini Neto apontou, na sessão de 22/05/2023, que o cálculo informado parecia divergir do valor de piso (R$ 3.845) previsto na Lei Complementar nº 1024/2022."}, {"tipo": "Denúncia", "numero": null, "data": "2023-05-08", "resumo": "O vereador Anderson Marcos Viana questionou o paradeiro de R$ 20 mil de uma emenda parlamentar do deputado federal Milton Vieira (de um total de R$ 120 mil, dos quais R$ 100 mil foram destinados a um lar/abrigo e R$ 20 mil anunciados publicamente para a causa animal), já que a prestação de contas apresentada pela administração somava apenas R$ 70 mil (referentes a outra emenda, conquistada pela vereadora Marisa Alves da Silva Costa também para a causa animal) e indicava que o dinheiro fora usado pela Secretaria de Saúde, e não para a causa animal como anunciado.", "nota": "Na sessão seguinte (99ª, 15/05/2023), o vereador Reinaldo Codognato apresentou a resposta de um requerimento próprio sobre o assunto: os R$ 20 mil da emenda do deputado Milton Vieira permaneciam depositados em conta bancária específica ('Emenda MV Investimento'), sem poderem ser usados para a causa animal por não haver, no momento, entidade com CNPJ própria para custódia do CNPJ da causa animal em Junqueirópolis; o caso ficou em aberto quanto à destinação final do valor."}, {"tipo": "Indicação", "numero": "081", "data": "2023-05-08", "resumo": "Solicita a limpeza e roçagem do mato alto no final da Rua São Salvador com a Rua Chapéu de Couro, área com mais de dois anos de acúmulo de mato, criadouro de escorpiões, cobras, ratos e do mosquito da dengue, e cujos moradores já chegaram a atear fogo no local por falta de manutenção.", "nota": "O texto da sessão indica repetidamente a data de 8 de maio de 2023 como data da 98ª Sessão Ordinária, enquanto o arquivo de transcrição está nomeado como 2023-05-09 (provável upload no YouTube um dia após a sessão real). Usada a data do texto (2023-05-08)."
