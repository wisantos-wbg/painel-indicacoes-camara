}, {"tipo": "Indicação", "numero": "082", "data": "2023-05-08", "resumo": "Solicita a realização de mutirões de limpeza contra o mosquito Aedes aegypti (transmissor de dengue, chikungunya, zika e febre amarela), com recolhimento de eletrodomésticos, garrafas pet, pneus e outros objetos que acumulam água, e reforça a necessidade de conscientização contínua da população.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-05-09, texto da sessão indica 8 de maio de 2023."}, {"tipo": "Indicação", "numero": "083", "data": "2023-05-08", "resumo": "Solicita a disponibilização de mais dias e horários para a entrega de remédios de alto custo na farmácia municipal, para reduzir o tempo de espera diante das longas filas formadas por pessoas que não podem aguardar por questões de saúde ou por residirem distantes.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-05-09, texto da sessão indica 8 de maio de 2023."}, {"tipo": "Indicação", "numero": "084", "data": "2023-05-08", "resumo": "Solicita manutenção nos esgotos próximos ao Centro de Formação Educacional (CEFE), em razão do forte mau cheiro que vem tomando conta da praça Álvaro de Oliveira Junqueira, prejudicando quem frequenta o local e os eventos ali promovidos.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-05-09, texto da sessão indica 8 de maio de 2023. Na sessão seguinte (99ª), a vereadora Teresinha relatou o mau cheiro e, na sessão de 22/05, foi informado que a causa era um cano rompido durante obra de um poste, já sanado."}, {"tipo": "Denúncia", "numero": null, "data": "2023-05-15", "resumo": "A vereadora Marisa Alves da Silva Costa relatou um caso concreto de maus-tratos: um morador feriu a cabeça do próprio cão com um objeto pontiagudo e tentou enforcá-lo. A vereadora foi à delegacia (acompanhada de policial, por se tratar de suposto usuário de drogas), o animal foi recolhido e está sob seus cuidados, e foi registrado boletim de ocorrência por maus-tratos.", "nota": "A vereadora recebeu o relato da população (moradores da vizinhança) e, a partir dele, acompanhou pessoalmente a ocorrência e o registro do boletim de ocorrência (BO) de maus-tratos contra animal; ela relatou também outro caso concreto em andamento na mesma fala, envolvendo um homem que agride o próprio cachorro, mas para o qual ainda não havia registro formal por falta de testemunha presencial disposta a fazer a denúncia."}, {"tipo": "Indicação", "numero": "085", "data": "2023-05-15", "resumo": "Solicita a instalação de um bebedouro de água na área de lazer do bairro Jardim Alvorada e, se estiver na programação, também no Bosque Municipal, para incentivar a hidratação durante atividades físicas e momentos de lazer.", "nota": "O texto da sessão indica repetidamente a data de 15 de maio de 2023 como data da 99ª Sessão Ordinária, enquanto o arquivo de transcrição está nomeado como 2023-05-16 (provável upload no YouTube um dia após a sessão real). Usada a data do texto (2023-05-15)."}, {"tipo": "Indicação", "numero": "086", "data": "2023-05-15", "resumo": "Solicita contato com a administração do município de Tupi Paulista para a construção conjunta da ponte que liga os dois municípios, utilizada por moradores do bairro Vila São João para trabalhar na cidade vizinha, também importante como rota alternativa para serviços de emergência.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-05-16, texto da sessão indica 15 de maio de 2023."}, {"tipo": "Indicação", "numero": "087", "data": "2023-05-15", "resumo": "Reforça a indicação nº 10/2022, de sua própria autoria, solicitando a implantação de uma academia ao ar livre na área verde (praça) do loteamento Delta Ville, cujos moradores já organizaram por conta própria mesas e bancos, mas ainda carecem de equipamentos de ginástica.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-05-16, texto da sessão indica 15 de maio de 2023."}, {"tipo": "Indicação", "numero": "088", "data": "2023-05-15", "resumo": "Solicita a instalação de brinquedos inclusivos nas praças públicas do município, para que crianças cadeirantes e não cadeirantes possam brincar e socializar juntas, promovendo inclusão social.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-05-16, texto da sessão indica 15 de maio de 2023."}, {"tipo": "Indicação", "numero": "089", "data": "2023-05-15", "resumo": "Solicita a implementação do projeto Melhor Caminho nas estradas rurais dos bairros Juriti, Segunda Seção e trecho do bairro União, para garantir a mobilidade da população, o escoamento da produção agrícola e reduzir riscos de acidentes por buracos e erosões.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-05-16, texto da sessão indica 15 de maio de 2023. Na mesma sessão, o vereador Reinaldo Codognato entregou também um abaixo-assinado com mais de 40 assinaturas de moradores do bairro Juriti em apoio a esta indicação."}, {"tipo": "Indicação", "numero": "090", "data": "2023-05-15", "resumo": "Solicita a manutenção do telhado e das paredes da Biblioteca Municipal, em razão de infiltrações decorrentes das chuvas que ameaçam danificar o acervo de livros, periódicos e documentos históricos.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-05-16, texto da sessão indica 15 de maio de 2023."}, {"tipo": "Indicação", "numero": "091", "data": "2023-05-15", "resumo": "Solicita a designação do contingente policial da atividade delegada para ações de fiscalização de trânsito em pontos estratégicos da cidade, em horários diversificados, visando penalizar condutores em alta velocidade e reduzir acidentes com veículos, pessoas e animais.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-05-16, texto da sessão indica 15 de maio de 2023."}, {"tipo": "Indicação", "numero": "092", "data": "2023-05-15", "resumo": "Solicita a adequação da iluminação das mesas nas áreas verdes dos bairros Aliança, Campo Belo, Carmesim II e demais áreas necessárias, para dar mais segurança aos frequentadores e permitir o uso noturno dos espaços.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-05-16, texto da sessão indica 15 de maio de 2023."}, {"tipo": "Indicação", "numero": "093", "data": "2023-05-15", "resumo": "Solicita a construção de coberturas nas entradas das Estratégias de Saúde da Família (ESFs) II, III, IV e VII, para proteger os usuários que aguardam atendimento das condições climáticas adversas.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-05-16, texto da sessão indica 15 de maio de 2023."}, {"tipo": "Indicação", "numero": "094", "data": "2023-05-15", "resumo": "Solicita que seja permitido o acesso de automóveis de pessoas com dificuldade de locomoção ou algum tipo de deficiência ao Bosque Municipal, além de destinar um estacionamento exclusivo para elas, já que o acesso de veículos ao local havia sido restrito de forma geral.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-05-16, texto da sessão indica 15 de maio de 2023."}, {"tipo": "Indicação", "numero": "095", "data": "2023-05-22", "resumo": "Solicita a implantação de uma faixa elevada na Rua Quinzinho da Cunha, nas proximidades da Escola Neide Macedo, local com grande fluxo de carros e motos em alta velocidade, que já atropelaram gatos e cachorros e arrancaram uma árvore.", "nota": "O texto da sessão indica repetidamente a data de 22 de maio de 2023 como data da 100ª Sessão Ordinária, enquanto o arquivo de transcrição está nomeado como 2023-05-23 (provável upload no YouTube um dia após a sessão real). Usada a data do texto (2023-05-22)."}, {"tipo": "Indicação", "numero": "096", "data": "2023-05-22", "resumo": "Solicita a implementação da matéria de Ciências Políticas na grade de ensino das escolas municipais, para promover a formação cidadã e a participação política consciente dos estudantes.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-05-23, texto da sessão indica 22 de maio de 2023."}, {"tipo": "Indicação", "numero": "097", "data": "2023-05-22", "resumo": "Solicita melhorias (infraestrutura e apoio institucional) para os vendedores ambulantes que comercializam seus produtos na entrada da cidade, visando sua inclusão social e econômica.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-05-23, texto da sessão indica 22 de maio de 2023."}, {"tipo": "Indicação", "numero": "098", "data": "2023-05-22", "resumo": "Solicita que a futura meia-quadra de basquete a ser construída na cidade receba o nome de \"Quadrinha do Português\", em homenagem ao saudoso Antônio Carlos Martins Pereira, um dos pioneiros do esporte no município.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-05-23, texto da sessão indica 22 de maio de 2023."}, {"tipo": "Indicação", "numero": "099", "data": "2023-05-22", "resumo": "Solicita a construção de um memorial para as vítimas fatais da Covid-19 na entrada do trevo principal do município, como forma de honrar sua memória e oferecer um local de reflexão e conforto aos familiares enlutados. Reforça indicação já apresentada na sessão de 16/11/2022.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-05-23, texto da sessão indica 22 de maio de 2023. O nome da avenida onde ficaria o memorial aparece transcrito como 'Avenida Geraldo Fudo'/'Avenida Geraldo Fudo' de forma inconsistente entre as fontes; grafia exata não confirmada."}, {"tipo": "Indicação", "numero": "100", "data": "2023-05-29", "resumo": "Solicita que o terminal rodoviário do município receba o nome do saudoso João Aparecido Zanzarini, que trabalhou no local por décadas (admitido em 21/10/1985, até seu falecimento em 20/07/2021), como homenagem por seu respeito e dedicação aos passageiros.", "nota": "O texto da sessão indica repetidamente a data de 29 de maio de 2023 como data da 101ª Sessão Ordinária, enquanto o arquivo de transcrição está nomeado como 2023-05-30 (provável upload no YouTube um dia após a sessão real). Usada a data do texto (2023-05-29)."}, {"tipo": "Indicação", "numero": "101", "data": "2023-05-29", "resumo": "Solicita a inclusão de iluminação no complexo esportivo em construção no bairro Vila Beatriz, cujo projeto de engenharia atual não prevê sistema de iluminação, para garantir segurança e permitir o uso noturno das instalações.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-05-30, texto da sessão indica 29 de maio de 2023."}, {"tipo": "Indicação", "numero": "102", "data": "2023-05-29", "resumo": "Reforça a indicação nº 101/2022, de sua própria autoria, solicitando a implementação de um crédito mensal destinado ao custeio de atendimentos e consultas médicas para animais carentes/abandonados do município, já que atualmente só as castrações são custeadas via CISNAP complementado por emendas parlamentares.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-05-30, texto da sessão indica 29 de maio de 2023."}, {"tipo": "Indicação", "numero": "103", "data": "2023-05-29", "resumo": "Solicita a realização de serviço de tapa-buracos nas vias pavimentadas do Distrito Industrial 4, cujo asfalto vem se degradando mesmo após pavimentação recente, prejudicando o tráfego de empresas e indústrias da região.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-05-30, texto da sessão indica 29 de maio de 2023."}, {"tipo": "Indicação", "numero": "104", "data": "2023-05-29", "resumo": "Solicita serviço de tapa-buracos na vicinal José Siniciato (JQL-050), que dá acesso à Usina Vale Verde e recebe tráfego intenso de veículos pesados, além de redutores de velocidade próximo à Cooperativa de Trabalho dos Catadores de Materiais Recicláveis (Cooperjunq), para segurança dos trabalhadores.", "nota": "Mesma observação de data do arquivo: transcrição nomeada 2023-05-30, texto da sessão indica 29 de maio de 2023."}, {"tipo": nto na parte interna quanto externa, incluindo bancos, calçadas, portas, luzes e muretas dos canteiros.", "nota": "Apresentada com apoio do vereador Elio Furini Neto, conforme leitura da indicação."}, {"tipo": "Requerimento", "numero": "026", "data": "2023-08-08", "resumo": "Requer informações ao Prefeito Municipal acerca do andamento das obras e serviços de pavimentação da estrada vicinal JQL 010 (Governador Mário Covas), que liga Junqueirópolis a Dracena, complementando o requerimento nº 07/2023.", "nota": "Motivado por dúvidas sobre um convênio firmado pela Prefeitura de Dracena para contratação de projeto executivo da via; vereadores questionaram se a informação anterior (de que a verba já estava disponível) era exata e solicitaram reunião com o responsável da pasta para esclarecimentos, sem resposta formal registrada nas sessões deste lote."}, {"tipo": "Requerimento", "numero": "027", "data": "2023-08-15", "resumo": "Requer informações ao Prefeito Municipal acerca do andamento da mudança do local do viveiro municipal para o prédio da escola do bairro Duas Barras, tendo em vista que o ofício nº 221/2022 (em resposta ao requerimento nº 17/2022) informara que a mudança estava programada para 2023 e nada havia sido feito até então.", "nota": "Vereador questionou em plenário o destino de mais de R$ 1,2 milhão repassados em dois anos para o viveiro municipal (via Associação Agrícola) caso a mudança de local não se concretizasse, sem resposta formal registrada nas sessões deste lote."}, {"tipo": "Denúncia", "numero": null, "data": "2023-10-02", "resumo": "O vereador Elio Furini Neto relatou que moradores o procuraram para relatar problemas com cães abandonados soltos nas ruas, incluindo casos concretos em que os animais morderam filhos e netos de moradores, e um relato de um parente que caiu de moto por causa de um desses animais soltos na via; o vereador cobrou providências da Prefeitura (castração, recolhimento e tratamento dos animais).", "nota": "O texto da sessão enda, bem como a data de assinatura do último convênio firmado.", "nota": "O ofício 235/2023, lido na própria sessão de 13/11/2023, respondeu informando sobre a solicitação à Secretaria de Habitação em 2021 e o loteamento Ville Liberta (Minha Casa Minha Vida). Na sessão seguinte (121ª, 21/11/2023) o vereador Anderson Marcos Viana reclamou explicitamente que a resposta 'não tem nada a ver' com o que foi perguntado (convênio CDHU para casas populares, distinto do programa Minha Casa Minha Vida). O texto da sessão menciona a data de 13/11/2023 (120ª Sessão Ordinária), enquanto o arquivo está nomeado como 2023-11-14. Usada a data do texto."}, {"tipo": "Requerimento", "numero": "049", "data": "2023-11-14", "resumo": "Requer o envio de ofício ao prefeito municipal solicitando esclarecimentos sobre os motivos que levaram à realização de novo recapeamento asfáltico na Avenida Junqueira, considerando que a via havia passado por esse processo recentemente.", "nota": "O texto da sessão menciona a data de 13/11/2023 (120ª Sessão Ordinária), enquanto o arquivo está nomeado como 2023-11-14. Usada a data do texto."}, {"tipo": "Indicação", "numero": "226", "data": "2023-11-21", "resumo": "Solicita flexibilização do horário de trabalho de trabalhadores expostos a longos períodos de sol (agentes comunitários de saúde, braçais, encanadores, serviços gerais), diante do calor intenso (até 40°C) e do risco à saúde, incluindo câncer de pele.", "nota": "Arquivo nomeado 2023-11-22, mas o texto indica 21 de novembro de 2023 como data da sessão. Usei a data do texto."}, {"tipo": "Indicação", "numero": "227", "data": "2023-11-21", "resumo": "Solicita redução da distância mínima para acesso ao transporte escolar de 1.500 metros para 1.200 metros, considerando a exposição de crianças à chuva e ao calor extremo no trajeto a pé.", "nota": "Mesma observação sobre a data da sessão (texto indica 21/11/2023; arquivo nomeado 2023-11-22)."}, {"tipo": "Indicação", "numero": "228", "data": "2023-11-21", "
