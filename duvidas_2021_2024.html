 a data de 21/11/2023 (121ª Sessão Ordinária), enquanto o arquivo está nomeado como 2023-11-22. Usada a data do texto."}, {"tipo": "Requerimento", "numero": "051", "data": "2023-11-22", "resumo": "Requer o envio de ofício à Diretoria de Ensino - Região de Adamantina solicitando informações sobre a viabilidade de providenciar a aquisição de ar-condicionado, a manutenção dos equipamentos já instalados nas unidades de ensino, bem como a manutenção dos ventiladores da Escola Estadual Escola Profº Idene Rodrigues dos Santos.", "nota": "O texto da sessão menciona a data de 21/11/2023 (121ª Sessão Ordinária), enquanto o arquivo está nomeado como 2023-11-22. Usada a data do texto."}, {"tipo": "Indicação", "numero": "231", "data": "2023-11-27", "resumo": "Solicita poda dos eucaliptos remanescentes na área verde do bairro Pioneiros (ruas Hermínio Grespan e Antônio Cabreira Reis), que apresentam risco às residências vizinhas em temporais e ventanias.", "nota": "Arquivo nomeado 2023-11-28, mas o texto indica 27 de novembro de 2023 como data da sessão. Usei a data do texto."}, {"tipo": "Indicação", "numero": "232", "data": "2023-11-27", "resumo": "Solicita instalação de uma farmácia no pronto-socorro municipal, para disponibilizar prontamente medicamentos aos pacientes atendidos no local.", "nota": "Mesma observação sobre a data da sessão (texto indica 27/11/2023; arquivo nomeado 2023-11-28)."}, {"tipo": "Indicação", "numero": "233", "data": "2023-11-27", "resumo": "Solicita replanejamento dos locais de espera para pacientes que viajam a outras cidades para tratamento médico, aproveitando os pontos de ônibus já existentes no município para reduzir os deslocamentos.", "nota": "Mesma observação sobre a data da sessão (texto indica 27/11/2023; arquivo nomeado 2023-11-28)."}, {"tipo": "Indicação", "numero": "234", "data": "2023-11-27", "resumo": "Solicita inclusão de mais um médico no pronto-socorro municipal nos horários de maior demanda, para reduzir o tempo de espera dos pacientes.", "nota": "Mesma observação sobre a data da sessão (texto indica 27/11/2023; arquivo nomeado 2023-11-28)."}, {"tipo": "Denúncia", "numero": null, "data": "2023-11-28", "resumo": "O vereador Anderson Marcos Viana relatou o caso concreto de moradores contemplados com casas populares pela CDHU que, durante atendimento da unidade móvel da CDHU na cidade, descobriram que já haviam quitado o financiamento havia até dois anos e continuaram recebendo e pagando carnês normalmente, sem que o sistema tivesse registrado a quitação; cobrou explicações de quem seria o responsável por essa falha de controle.", "nota": "O texto da sessão menciona a data de 27/11/2023 (122ª Sessão Ordinária), enquanto o arquivo está nomeado como 2023-11-28. Usada a data do texto. Caso relatado durante atendimento da CDHU móvel realizado no sábado anterior à sessão."}, {"tipo": "Denúncia", "numero": null, "data": "2023-11-28", "resumo": "O vereador Anderson Marcos Viana denunciou o estado de abandono do Parque Ecológico, citando o exemplo concreto do piso do campinho de vôlei/areia, hoje coberto por terra dura e murundus, canos de PVC quebrados representando risco de acidente, grama invadindo a quadra e rede esportiva deteriorada; relatou que, na falta de resposta da administração, chegou a custear pessoalmente (via doador) um caminhão de areia para o local e se ofereceu a doar outro.", "nota": "O texto da sessão menciona a data de 27/11/2023 (122ª Sessão Ordinária), enquanto o arquivo está nomeado como 2023-11-28. Usada a data do texto."}, {"tipo": "Requerimento", "numero": "052", "data": "2023-11-28", "resumo": "Requer o envio de ofício ao prefeito municipal solicitando complementação das informações fornecidas no requerimento nº 32/2023, especificamente sobre o conteúdo e os custos do outdoor situado no cruzamento das avenidas 7 de Setembro/Geraldo Fudo e do outdoor localizado no Distrito Industrial 4, além de informações sobre os carros de som que circulam pela cidade anunciando serviços da Prefeitura, incluindo custos e período de veiculação.", "nota": "O texto da sessão menciona a data de 27/11/2023 (122ª Sessão Ordinária), enquanto o arquivo está nomeado como 2023-11-28. Usada a data do texto. Trata-se de complemento ao requerimento nº 32/2023 (não incluído neste lote)."}, {"tipo": "Indicação", "numero": "235", "data": "2023-12-04", "resumo": "Solicita concessão de bonificação extra (por exemplo, em forma de ticket) aos servidores municipais no mês de dezembro, como reconhecimento pelo trabalho realizado ao longo do ano.", "nota": "Arquivo nomeado 2023-12-05, mas o texto indica 4 de dezembro de 2023 como data da sessão. Usei a data do texto."}, {"tipo": "Indicação", "numero": "236", "data": "2023-12-04", "resumo": "Solicita aquisição de um micro-ônibus com recursos próprios para o setor da saúde, devido ao desgaste e à ineficiência da atual frota de veículos.", "nota": "Mesma observação sobre a data da sessão (texto indica 4/12/2023; arquivo nomeado 2023-12-05)."}, {"tipo": "Indicação", "numero": "237", "data": "2023-12-04", "resumo": "Solicita restauração da estrada municipal do bairro Juriti, com pontos afunilados e bambus obstruindo a visibilidade, representando risco à segurança viária.", "nota": "Mesma observação sobre a data da sessão (texto indica 4/12/2023; arquivo nomeado 2023-12-05)."}, {"tipo": "Indicação", "numero": "238", "data": "2023-12-04", "resumo": "Solicita promoção de festividades de fim de ano na Praça do Centenário, resgatando a tradição realizada em anos anteriores, diante da demanda da população por eventos de integração social.", "nota": "Mesma observação sobre a data da sessão (texto indica 4/12/2023; arquivo nomeado 2023-12-05)."}, {"tipo": "Indicação", "numero": "239", "data": "2023-12-04", "resumo": "Reforçando a indicação 28/2022, solicita instituição de auxílio municipal oncológico para fornecimento de alimentos naturais e saudáveis a pacientes em tratamento de quimioterapia, radioterapia ou outros tratamentos oncológicos, para manutenção da imunidade.", "nota": "Mesma observação sobre a data da sessão (texto indica 4/12/2023; arquivo nomeado 2023-12-05)."}, {"tipo": "Indicação", "numero": "240", "data": "2023-12-04", "resumo": "Reforçando a indicação 113/2022, solicita manutenção do ginásio de esportes Cícero Gomes (piso, iluminação, troca das redes laterais e retirada de grades nas proximidades da quadra), visando o campeonato de férias de 2024.", "nota": "Mesma observação sobre a data da sessão (texto indica 4/12/2023; arquivo nomeado 2023-12-05)."}, {"tipo": "Indicação", "numero": "241", "data": "2023-12-04", "resumo": "Reforçando a indicação 98/2022, solicita instalação de academia ao ar livre no bairro Duas Barras, com o nome da pioneira Sandra Gonçalves Amaral, além de bebedouro de água potável, reforma dos banheiros públicos e pavimentação de cerca de 200 metros de acesso.", "nota": "Mesma observação sobre a data da sessão (texto indica 4/12/2023; arquivo nomeado 2023-12-05)."}, {"tipo": "Indicação", "numero": "242", "data": "2023-12-04", "resumo": "Solicita parceria com a Associação Comercial para contratação de um vigilante/guarda noturno destinado a zelar pela segurança do comércio local.", "nota": "Mesma observação sobre a data da sessão (texto indica 4/12/2023; arquivo nomeado 2023-12-05)."}, {"tipo": "Indicação", "numero": "243", "data": "2023-12-04", "resumo": "Solicita manutenção nos 'bigodes' (drenagem lateral) das estradas rurais, priorizando mão de obra manual nos trechos críticos durante o período chuvoso, como forma de economizar horas-máquina.", "nota": "Mesma observação sobre a data da sessão (texto indica 4/12/2023; arquivo nomeado 2023-12-05)."}, {"tipo": "Denúncia", "numero": null, "data": "2023-12-05", "resumo": "O vereador Anderson Marcos Viana relatou o caso concreto de uma criança de 1 ano e 1 mês do município que necessita de cirurgia de aproximadamente R$ 40-46 mil não coberta pelos convênios de saúde votados pela Câmara, cuja família recorreu a vaquinha nas redes sociais; afirmou que a Secretaria de Saúde está a par do caso há mais de 5 meses sem solução, e que a criança passou por diversos diagnósticos e avaliações médicas equivocadas antes da identificação correta da doença, o que atrasou o tratamento.", "nota": "O texto da sessão menciona a data de 4/12/2023 (123ª Sessão Ordinária), enquanto o arquivo está nomeado como 2023-12-05. Usada a data do texto. O vereador citou também o caso de um amigo que teria falecido após 6 meses de espera por atendimento em outra especialidade, sem detalhar mais."}, {"tipo": "Denúncia", "numero": null, "data": "2023-12-05", "resumo": "O vereador Anderson Marcos Viana denunciou o estado de sucateamento do micro-ônibus ('branquinho') usado pelo setor de transporte da saúde para levar pacientes a Presidente Prudente, relatando caso concreto em que o veículo perdeu velocidade repentinamente (de 60 para 20 km/h) durante viagem, com ferragem do teto se soltando e impossibilidade de instalar cinto de segurança; cobrou da administração a aquisição de veículo novo com recursos próprios, já que o governo estadual não havia providenciado substituição.", "nota": "O texto da sessão menciona a data de 4/12/2023 (123ª Sessão Ordinária), enquanto o arquivo está nomeado como 2023-12-05. Usada a data do texto. Relacionada à indicação nº 236/2023, de mesma autoria, pedindo aquisição de micro-ônibus para a saúde."}, {"tipo": "Requerimento", "numero": "053", "data": "2023-12-05", "resumo": "Requer o envio de ofício ao prefeito municipal solicitando cópias dos atos que formalizam o convênio firmado entre a Defesa Civil do Estado de São Paulo e o município, objetivando a transferência de equipamentos para ações de proteção e defesa civil.", "nota": "O ofício 263/2023, lido na sessão de 11/12/2023 (referente ao ofício da Câmara nº 162/2023), informou que o projeto já havia sido elaborado e encaminhado à Defesa Civil do Estado, aguardando vistoria e posterior assinatura de convênio. O texto da sessão menciona a data de 4/12/2023 (123ª Sessão Ordinária), enquanto o arquivo está nomeado como 2023-12-05. Usada a data do texto."}, {"tipo": "Denúncia", "numero": null, "data": "2023-12-12", "resumo": "O vereador Anderson Marcos Viana cobrou o paradeiro de aproximadamente 8 caminhões-truck de pedras portuguesas retiradas da Praça Álvaro de Oliveira Junqueira durante sua reforma e armazenadas no bairro Duas Barras, que desapareceram entre visitas suas ao local em 1º e 13 de julho de 2023; classificou como insatisfatória a resposta da administração (ofício 264/2023), que atribuiu a retirada à 'gestão anterior' e alegou desconhecimento do assunto, e cobrou explicações sobre por que o setor responsável nunca teria verificado o local em três anos.", "nota": "O texto da sessão menciona a data de 11/12/2023 (124ª Sessão Ordinária), enquanto o arquivo está nomeado como 2023-12-12_2. Usada a data do texto. Caso vinculado ao requerimento nº 50/2023 (ver arquivo de requerimentos); o vereador variou o número de caminhões citados entre sessões (4, depois 8), dizendo evitar cravar o número exato 'para não dar processo' - possível exagero retórico, mantido conforme relatado."}, {"tipo": "Denúncia", "numero": null, "data": "2023-12-12", "resumo": "Os vereadores relataram casos concretos de danos a equipamentos domésticos (queima de modem de internet, queima de um freezer no bairro próximo ao Troiano) causados por quedas/oscilações recorrentes de energia elétrica em diversos bairros da cidade, incluindo o Jardim das Américas; cobraram da concessionária Neoenergia, por meio da administração, explicações e soluções para a instabilidade da rede.", "nota": "O texto da sessão menciona a data de 11/12/2023 (124ª Sessão Ordinária), enquanto o arquivo está nomeado como 2023-12-12_2. Usada a data do texto. Relacionada à indicação nº 244/2023, de autoria de Anderson Marcos Viana, sobre a mesma questão."}, {"tipo": "Denúncia", "numero": null, "data": "2023-12-12", "resumo": "O vereador Anderson Marcos Viana relatou confusão gerada por verba de causa animal anunciada em vídeo por um deputado como destinada a esse fim, mas que, segundo resposta da administração, teria sido incorporada ao setor de saúde; como resultado, munícipes passaram a procurar a casa da vereadora Marisa Alves da Silva Costa pedindo ração, quando o correto seria procurar o setor de zoonoses/saúde para castração e apoio a animais.", "nota": "O texto da sessão menciona a data de 11/12/2023 (124ª Sessão Ordinária), enquanto o arquivo está nomeado como 2023-12-12_2. Usada a data do texto."}, {"tipo": "Denúncia", "numero": null, "data": "2023-12-12", "resumo": "O vereador Anderson Marcos Viana cobrou da administração, pela quinta ou sexta vez ao longo de anos, o repasse em dinheiro (bonificação equivalente a um 13º salário) aos Agentes Comunitários de Saúde (ACS) e Agentes de Combate a Endemias (ACE), afirmando que o município recebe recursos federais destinados a essa bonificação mas nunca os repassa aos agentes, ao contrário de outros municípios da região.", "nota": "O texto da sessão menciona a data de 11/12/2023 (124ª Sessão Ordinária), enquanto o arquivo está nomeado como 2023-12-12_2. Usada a data do texto. Relacionada à indicação nº 248/2023, de mesma autoria, propondo lei para conceder o incentivo."}, {"tipo": "Indicação", "numero": "244", "data": "2023-12-12", "resumo": "Solicita providências junto à empresa Neoenergia Elektro em razão da instabilidade elétrica em diversos pontos da cidade, que vem causando danos a aparelhos domésticos.", "nota": "Conforme instrução do lote, usei data_sessao 2023-12-12 (arquivo 2023-12-12_2_sessao.txt), embora o texto da sessão mencione '11 de dezembro de 2023' como data da sessão."}, {"tipo": "Indicação", "numero": "245", "data": "2023-12-12", "resumo": "Reforçando a indicação 49/2021, solicita implantação de um aplicativo voltado à área da saúde do município, para agendamento de consultas, alertas de vacinação e acesso remoto a serviços de saúde.", "nota": "Conforme instrução do lote, usei data_sessao 2023-12-12 (arquivo 2023-12-12_2_sessao.txt), embora o texto da sessão mencione '11 de dezembro de 2023' como data da sessão."}, {"tipo": "Indicação", "numero": "246", "data": "2023-12-12", "resumo": "Reforçando a indicação 160/2022, solicita instituição de atendimento veterinário público a cada 15 dias, priorizando a população de baixa renda beneficiária de programas sociais e os casos de urgência/emergência.", "nota": "Conforme instrução do lote, usei data_sessao 2023-12-12 (arquivo 2023-12-12_2_sessao.txt), embora o texto da sessão mencione '11 de dezembro de 2023' como data da sessão."}, {"tipo": "Indicação", "numero": "247", "data": "2023-12-12", "resumo": "Solicita construção de uma canaleta na interseção da Rua das Palmeiras com a Alameda Paraíso, para escoamento eficiente das águas pluviais e preservação do pavimento.", "nota": "Conforme instrução do lote, usei data_sessao 2023-12-12 (arquivo 2023-12-12_2_sessao.txt), embora o texto da sessão mencione '11 de dezembro de 2023' como data da sessão."}, {"tipo": "Indicação", "numero": "248", "data": "2023-12-12", "resumo": "Solicita projeto de lei que conceda incentivo financeiro adicional (equivalente a um 14º salário) aos agentes comunitários de saúde (ACS) e agentes de combate a endemias (ACE) do município, como reconhecimento pelo trabalho realizado.", "nota": "Conforme instrução do lote, usei data_sessao 2023-12-12 (arquivo 2023-12-12_2_sessao.txt), embora o texto da sessão mencione '11 de dezembro de 2023' como data da sessão."}, {"tipo": "Indicação", "numero": "249", "data": "2023-12-12", "resumo": "Solicita análise para flexibilizar o horário de ensino da rede municipal, especialmente para alunos da zona rural, devido à longa jornada de transporte e ao impacto do calor e da distância no desempenho escolar.", "nota": "Conforme instrução do lote, usei data_sessao 2023-12-12 (arquivo 2023-12-12_2_sessao.txt), embora o texto da sessão mencione '11 de dezembro de 2023' como data da sessão."}, {"tipo": "Indicação", "numero": "250", "data": "2023-12-12", "resumo": "Solicita busca de recursos estaduais e/ou federais para a criação de um novo Centro Educacional Infantil (CEI), propondo funcionamento em horário comercial (das 8h às 18h) para atender pais e mães trabalhadores.", "nota": "Conforme instrução do lote, usei data_sessao 2023-12-12 (arquivo 2023-12-12_2_sessao.txt), embora o texto da sessão mencione '11 de dezembro de 2023' como data da sessão."}, {"tipo": "Requerimento", "numero": "054", "data": "2023-12-12", "resumo": "Requer o envio de ofício ao prefeito municipal solicitando esclarecimentos sobre as medidas adotadas diante da ausência do brasão do município em alguns veículos públicos municipais, especialmente os veículos de representação, tendo em vista resposta anterior (referente ao requerimento nº 35/2023) que indicava que medidas seriam implantadas.", "nota": "O texto da sessão menciona a data de 11/12/2023 (124ª Sessão Ordinária), enquanto o arquivo está nomeado como 2023-12-12_2. Usada a data do texto. Trata-se de complemento ao requerimento nº 35/2023 (não incluído neste lote)."}, {"tipo": "Denúncia", "numero": null, "data": "2023-12-18", "resumo": "Vereador Anderson Marcos Viana denunciou que, no concurso público municipal realizado nos dias 16 e 17 de dezembro, a mesma prova teria sido aplicada para cargos distintos (tratorista, auxiliar de enfermagem e agente de saúde), orientando os candidatos que se sentissem prejudicados a buscar orientação jurídica e recorrer via mandado de segurança.", "nota": "Vereador afirmou não ter acesso direto às provas; denúncia baseada em relatos de terceiros/população que o procurou."}, {"tipo": "Denúncia", "numero": null, "data": "2023-12-18", "resumo": "Vereador Anderson Marcos Viana denunciou que a administração municipal e a imprensa da cidade deixam de divulgar recursos (emendas parlamentares) destinados por vereadores que não fazem parte da \"base\" governista, citando especificamente doações à Santa Casa de R$ 999.986,00 (obtida em 10/11 com o Deputado Arlindo Chignalia) e R$ 300 mil (obtidos com o Deputado Reinaldo Alguz) que não teriam sido divulgadas pela administração, em contraste com R$ 100 mil doados por outro vereador que foi amplamente noticiado.", "nota": "Relato baseado na percepção do próprio vereador sobre tratamento diferenciado na divulgação de verbas; não há confirmação documental citada na sessão."}, {"tipo": "Denúncia", "numero": null, "data": "2023-12-18", "resumo": "Vereadora Terezinha de Lourdes Freitas Regodanço relatou que, na semana anterior à sessão, uma criança caiu da arquibancada do complexo esportivo Joaquina Porto Ferreira e ficou gravemente ferida, precisando ser transferida para atendimento médico fora do município, devido à falta de proteção (parapeito/corrimão) no local.", "nota": "Relato motivou a indicação nº 251/2023, apresentada na mesma sessão."}, {"tipo": "Denúncia", "numero": null, "data": "2023-12-18", "resumo": "Vereador Anderson Marcos Viana relatou um acidente com o filho de um amigo na arquibancada do Campo da Curitiba, na Vila Beatriz: a criança perdeu o controle da bicicleta e caiu entre a calçada e a arquibancada, sofrendo fratura no braço e ferimentos na cabeça e no peito, sendo transferida em estado grave para Presidente Prudente. O vereador questionou se o local possuía AVCB (Auto de Vistoria do Corpo de Bombeiros) e criticou a ausência de corrimão/alambrado na estrutura.", "nota": "Pode se tratar do mesmo episódio citado por outros vereadores em relação à arquibancada do complexo Joaquina Porto Ferreira, ou de um caso distinto em outro local (Campo da Curitiba/Vila Beatriz) — recomenda-se verificar com o vereador antes de publicar."}, {"tipo": "Denúncia", "numero": null, "data": "2023-12-18", "resumo": "Vereador Anderson Marcos Viana cobrou da administração municipal a ausência de qualquer projeto de lei ou comunicado sobre o reajuste salarial dos servidores públicos até o encerramento do ano legislativo de 2023, alertando que outras cidades da região já haviam fechado o índice de aumento.", "nota": "Trata-se mais de uma cobrança política do que de uma denúncia formal de irregularidade; incluído por envolver um fato concreto (ausência de projeto)."}, {"tipo": "Indicação", "numero": "251", "data": "2023-12-18", "resumo": "Solicita a instalação de medidas de segurança (parapeito, guarda-corpo, tela ou outra forma de proteção, além de corrimão) na arquibancada do complexo esportivo Joaquina Porto Ferreira, devido ao risco de quedas evidenciado por um acidente recente envolvendo uma criança.", "nota": "Arquivo de nome 2023-12-19, mas o texto da sessão indica repetidamente que ela foi realizada em 18 de dezembro de 2023 (data usada em data_sessao). No resumo do expediente lido no início da sessão, esta indicação foi anunciada por engano como número 241; a leitura do texto integral, mais adiante, confirma o número correto como 251."}, {"tipo": "Denúncia", "numero": null, "data": "2024-01-15", "resumo": "Vereador Anderson Marcos Viana denunciou que a reunião realizada pelo prefeito para debater o índice de reajuste salarial dos servidores contou apenas com a presença do presidente da Câmara e da vereadora Sofia Rodrigues dos Santos, sem convite aos demais vereadores; segundo relatos que ele reproduziu (sem confirmar), a exclusão teria sido intencional para afastar vereadores vistos como oposição.", "nota": "O próprio vereador ressalvou que não tem certeza da veracidade do motivo da exclusão ('não estamos dizendo que é verdade, palavras soam por aí')."}, {"tipo": "Denúncia", "numero": null, "data": "2024-02-05", "resumo": "Vereador Anderson Marcos Viana apresentou formalmente uma denúncia de suposto desvio de patrimônio público: pedras portuguesas retiradas do Jardim Álvaro Junqueira (cerca de seis caminhões truncados) e levadas para trás do Campo das Duas Barras desapareceram; segundo resposta a requerimento anterior, as pedras teriam sumido \"no mandato passado\", mas o vereador afirma ter fotos datadas de janeiro de 2023 mostrando as pedras ainda no local, contradizendo essa versão. Pediu que o caso seja apurado, inclusive pelo Ministério Público.", "nota": "O próprio vereador qualificou a denúncia como \"suposta\" para evitar processo por difamação; pediu explicitamente investigação do Ministério Público."}, {"tipo": "Indicação", "numero": "001", "data": "2024-02-05", "resumo": "Solicita que se estude homenagear os saudosos José Mateus Granado, Milton Tramonte Crenich(e) e Oscar Codognato, atribuindo seus nomes a uma rua ou ponto de referência significativo do município.", "nota": "O sobrenome 'Crenich(e)/Criniche' aparece transcrito de forma pouco consistente ao longo do texto (ora 'Crenich', ora 'Criniche'); mantida a grafia mais recorrente."}, {"tipo": "Indicação", "numero": "007", "data": "2024-02-05", "resumo": "Solicita a criação de uma pasta dedicada à segurança e saúde dos servidores (SESMT), com recursos orçamentários próprios para capacitações, exames médicos, organização da CIPAT e aquisição de equipamentos de proteção individual (EPIs).", "nota": "O texto lido menciona 'reforçando a indicação número 201-203', referência que não foi possível confirmar/localizar; mantida como consta na transcrição."}, {"tipo": "Requerimento", "numero": "001", "data": "2024-02-05", "resumo": "Solicita esclarecimentos sobre o processo de formalização e operacionalização das atividades econômicas de pessoas físicas e jurídicas no município, com atenção especial à situação da abertura de supermercados aos domingos e feriados.", "nota": "Aprovado por unanimidade de votos. Requerimento relacionado a debate sobre horário de funcionamento do comércio, tema também discutido extensamente nas explicações pessoais desta sessão e da sessão seguinte."}, {"tipo": "Requerimento", "numero": "002", "data": "2024-02-05", "resumo": "Solicita o envio de ofício ao DER-SP e à Casa Civil do Estado de São Paulo comunicando a relevância do início das obras de pavimentação da estrada vicinal JQL-010 (Governador Mário Covas), que liga Junqueirópolis a Dracena, já com projeto executivo contratado.", "nota": "Destinatários são órgãos externos ao município (mantidos os nomes reais), não uma diretoria da Prefeitura. Aprovado por unanimidade de votos. Vereador relatou que o pleito vem sendo reforçado desde 2021."}, {"tipo": "Requerimento", "numero": "003", "data": "2024-02-05", "resumo": "Solicita esclarecimentos sobre as medidas que a administração municipal tem tomado para resolver a constante queda de energia elétrica em diversos setores da cidade, incluindo prédios públicos.", "nota": "Diretoria de destino incerta: o requerimento é endereçado ao Prefeito Municipal questionando providências da administração, mas o problema em si é atribuído à concessionária de energia elétrica (Elektro/citada como 'Electro' na transcrição) e à ANEEL, para as quais a Câmara já havia enviado ofícios em separado, segundo relato do vereador Elio Furini Neto."}, {"tipo": "Denúncia", "numero": null, "data": "2024-02-14", "resumo": "Vereador Anderson Marcos Viana denunciou que a obra de contenção da erosão conhecida como \"buracão\" no Jardim Paulista, orçada em R$ 2,5 milhões e aprovada pela Câmara havia quase um ano, ainda não havia sido iniciada, apesar do risco de a erosão atingir residências (segundo ele, bastariam cerca de 2,5 metros de avanço para engolir uma casa). Suspeitou que o início da obra estaria sendo propositalmente adiado para coincidir com o período eleitoral.", "nota": "Vereadora Terezinha de Lourdes Freitas Regodanço confirmou, na mesma sessão, que a obra ainda não havia começado apesar da verba aprovada."}, {"tipo": "Denúncia", "numero": null, "data": "2024-02-14", "resumo": "Vereador Anderson Marcos Viana denunciou tratamento desigual na concessão de transporte escolar entre bairros: enquanto em alguns pontos o critério de distância mínima teria sido reduzido informalmente para 900-1.200 metros, outras crianças (caso citado: menina de 6 anos na Rua Curitiba, a 1.000 metros da escola, e outra criança a 1.100 metros perto do CRAS/Criança Feliz) tiveram o transporte negado por não atingirem os 1.500 metros previstos na lei federal.", "nota": "Vereador Reinaldo Codognato respondeu na mesma sessão que a diferença decorre de linhas divisórias de bairros e não de privilégio, propondo esclarecimento em vídeo institucional; ponto ainda controverso entre os vereadores."}, {"tipo": "Denúncia", "numero": null, "data": "2024-02-14", "resumo": "Vereador Paulo Sérgio Cordeiro relatou ter recebido ameaças em razão dos requerimentos 04/2024 e 05/2024, que pedem esclarecimentos sobre contratos de mídia e propaganda e sobre vínculos de fornecedores com a Prefeitura Municipal, sem detalhar a origem ou o teor das ameaças.", "nota": "Vereador não identificou o autor nem detalhou a natureza da ameaça; verificar se houve registro de boletim de ocorrência."}, {"tipo": "Denúncia", "numero": null, "data": "2024-02-14", "resumo": "Vereador Anderson Marcos Viana reiterou reclamações da população sobre o concurso público municipal, alegando que pessoas ligadas à empresa organizadora ou a encarregados/moradores da cidade poderiam ter participado da aplicação das provas, e voltou a orientar os interessados a buscar advogado e impetrar mandado de segurança.", "nota": "Reitera a denúncia já feita na sessão de 19/12/2023 sobre o mesmo concurso; sem provas concretas apresentadas em plenário."}, {"tipo": "Denúncia", "numero": null, "data": "2024-02-14", "resumo": "Vereadora Marisa Alves da Silva Costa denunciou que deixou de receber um veículo destinado ao trabalho de resgate e castração de animais porque não faz parte da \"base\" política da administração, tendo que usar seu próprio carro e combustível para buscar animais para castração.", "nota": "Relato pouco detalhado quanto à origem do veículo (possível emenda parlamentar) e a quem caberia a decisão; vereadora não identificou responsáveis."}, {"tipo": "Indicação", "numero": "014", "data": "2024-02-14", "resumo": "Solicita a reforma e ampliação da pista de skate, além da criação de um programa de incentivo à prática desse esporte.", "nota": "Reforça pedidos do próprio vereador feitos desde 2021, segundo o texto lido."}, {"tipo": "Requerimento", "numero": "004", "data": "2024-02-14", "resumo": "Solicita os contratos e processos licitatórios de fornecedores/prestadores de serviços do setor de mídias e propagandas referentes aos anos de 2021, 2022 e 2023, complementando a relação já fornecida pelo Executivo através do ofício nº 197/2023 (excluídos contratos de 2023 já obtidos de três empresas específicas).", "nota": "Aprovado por unanimidade de votos. Vereador mencionou em explicações pessoais ter recebido ameaças relacionadas a este requerimento e ao nº 05/2024."}, {"tipo": "Requerimento", "numero": "005", "data": "2024-02-14", "resumo": "Solicita esclarecimentos sobre os vínculos contratuais ou de prestação de serviço entre a empresa Renan Vinícius Tomás Monteiro (TV Oeste Diário) e o jornalista Fernando Aguiar Ramos com a Prefeitura Municipal, incluindo o motivo de ambos não constarem na relação de fornecedores de mídia fornecida no ofício nº 197/2023, além de cópias dos respectivos contratos.", "nota": "Aprovado por unanimidade de votos. Vereador mencionou em explicações pessoais ter recebido ameaças relacionadas a este requerimento e ao nº 04/2024."}, {"tipo": "Requerimento", "numero": "006", "data": "2024-02-14", "resumo": "Solicita dados referentes ao percentual de despesas com pessoal da Prefeitura Municipal no ano de 2023, bem como o valor do superávit alcançado no mesmo período.", "nota": "Aprovado por unanimidade de votos. Vereador relatou que a questão havia sido levantada durante o debate de votação do aumento salarial dos servidores em janeiro/2024 (sessão extraordinária de 2024-01-16), sendo este requerimento a formalização do pedido de informação."}, {"tipo": "Denúncia", "numero": null, "data": "2024-02-19", "resumo": "Vereador Anderson Marcos Viana denunciou o caso de uma moradora idosa (referida na fala como \"Dona Beramina\") cuja casa apresenta rachaduras graves; apesar de duas visitas da Defesa Civil, nenhuma solução foi dada, e a moradora teria recebido de uma autoridade não identificada a resposta desrespeitosa de que bastaria \"achar um marido\" para resolver o problema.", "nota": "Nome da moradora não ficou claro na transcrição (soa como 'Beramina'/'Berenice'); autor da fala desrespeitosa não identificado pelo vereador. Recomenda-se confirmar grafia do nome antes de publicar."}, {"tipo": "Denúncia", "numero": null, "data": "2024-02-19", "resumo": "Vereador Anderson Marcos Viana denunciou a construção de uma calçada de concreto de aproximadamente 150 metros de comprimento por 1,20 m de largura e 20 cm de espessura (cerca de R$ 8.585 em material mais R$ 6.000 em mão de obra, segundo notas fiscais em nome da Prefeitura Municipal que ele fotografou) em terreno particular atrás de um estabelecimento comercial, sem utilidade pública aparente. Anunciou que protocolaria requerimento pedindo explicações da administração sobre o uso de recursos públicos na obra.", "nota": "Vereador afirma ter fotografado as notas fiscais como prova; aguardar eventual requerimento formal e resposta da administração."}, {"tipo": "Denúncia", "numero": null, "data": "2024-02-26", "resumo": "O vereador Anderson Marcos Viana relatou que a caminhonete da Defesa Civil do município é frequentemente encontrada de madrugada em locais diversos, fora do horário e do local de serviço, e cobrou informações sobre o convênio de transferência de equipamentos celebrado entre o Estado de São Paulo e o município para ações de proteção e defesa civil; afirmou que o ofício enviado sobre o assunto no ano anterior não havia sido respondido e cogitou impetrar mandado de segurança.", "nota": "A Diretoria de Obras é apontada como responsável pela Defesa Civil no relato do vereador (mesmo secretário acumula as duas funções). Ofício de resposta sobre o convênio (nº 51/2024) foi lido na sessão seguinte (131ª, 2024-03-11)."}, {"tipo": "Indicação", "numero": "033", "data": "2024-02-26", "resumo": "Solicita a melhoria da iluminação do campo de futebol da Vila Beatriz, incluindo a colocação de guarda-corpos e corrimão nas arquibancadas, tendo em vista acidente já ocorrido com uma criança no local.", "nota": "A transcrição do expediente e do texto integral desta sessão data o expediente e as indicações como 'a ser realizada em 26 de fevereiro de 2024' (uma segunda-feira), enquanto o arquivo de transcrição está nomeado como 2024-02-27. Adotei 2024-02-26 como data_sessao por ser a data citada repetidamente no próprio texto (cabeçalhos das indicações e requerimentos). O mesmo padrão de divergência de um dia se repete nas demais sessões deste lote."}, {"tipo": "Requerimento", "numero": "07", "data": "2024-02-26", "resumo": "Solicita informações ao prefeito municipal acerca do envio do projeto de lei à Câmara Municipal que versa sobre o repasse do piso nacional da enfermagem no município de Junqueirópolis no ano de 2024.", "nota": "Aprovado por unanimidade de votos. Data da sessão conforme mencionada repetidamente no texto da transcrição (26/02/2024), divergente da data do nome do arquivo (2024-02-27). Requerimento relacionado a projetos de lei nº 12 a 17/2024 (aditamentos de convênio com a Santa Casa), que vieram com erro e foram retirados de pauta na mesma sessão."}, {"tipo": "Requerimento", "numero": "08", "data": "2024-02-26", "resumo": "Solicita esclarecimentos sobre a suposta participação da Prefeitura na construção de calçada em terreno privado, situado na Rua Victor Camargo Bodini (mencionada na transcrição também como \"Victor Camargo Budini\"), no bairro Frei Galvão, ao lado do estabelecimento 3D Lava Rápido, incluindo motivo da obra, responsável pelo acompanhamento e gastos envolvidos.", "nota": "Aprovado por unanimidade de votos. Grafia do sobrenome do proprietário do terreno divergente na transcrição (\"Camargo Bonine\"/\"Camargo Budini\"); mantida a forma predominante \"Camargo Bonini\"."}, {"tipo": "Requerimento", "numero": "09", "data": "2024-02-26", "resumo": "Solicita informações sobre a operação de crédito relacionada à execução das obras para o fechamento da grande erosão conhecida como \"Buracão\", no Jardim Paulista, incluindo data da operação, valor recebido e se o montante está disponível ou já foi utilizado.", "nota": "Aprovado por unanimidade de votos."}, {"tipo": "Requerimento", "numero": "10", "data": "2024-02-26", "resumo": "Solicita informações sobre a operação de crédito relacionada à execução das obras para a construção da usina fotovoltaica no município, incluindo data da operação, valor recebido e se o montante está disponível ou já foi utilizado.", "nota": "Aprovado por unanimidade de votos. Em explicações pessoais o vereador relatou que a usina (orçada em aproximadamente 8 milhões de reais, votada em 2023) não apresentava andamento visível."}, {"tipo": "Denúncia", "numero": null, "data": "2024-03-04", "resumo": "O vereador Anderson Marcos Viana relatou ter constatado a construção de 13 pilares de concreto para postes de iluminação embaixo da linha férrea, em trecho que já possuía 8 postes de energia, sem que a Câmara tivesse conhecimento prévio da obra, questionando o uso do dinheiro público nesse serviço em vez de iluminar bairros carentes.", "nota": "Assunto retomado em sessões posteriores (132ª e 134ª) pelo mesmo vereador, questionando o uso repetido de concreto em obras \"debaixo da linha\"."}, {"tipo": "Denúncia", "numero": null, "data": "2024-03-04", "resumo": "O vereador Anderson Marcos Viana relatou que, na Rua do Viveiro, sentido Delta Ville, um fio elétrico caído atingiu um motociclista, arrancando parte da pele do pescoço da vítima; o trecho carece de iluminação e há travessia de animais na pista.", "nota": "O vereador afirmou ter filmado moradores relatando o ocorrido, mas não chegou a publicar o vídeo."}, {"tipo": "Denúncia", "numero": null, "data": "2024-03-04", "resumo": "O vereador Anderson Marcos Viana relatou caso concreto de uma criança de 9 anos, moradora a aproximadamente 2.200 metros da escola, que não teria direito a transporte escolar segundo o critério informado pela administração, apesar de informações divergentes (900 m, 1.500 m) terem sido dadas pela Secretaria de Educação em diferentes ocasiões sobre a distância mínima exigida.", "nota": "Vereador solicitou a presença do secretário de Educação em sessão para esclarecer os critérios de concessão do transporte escolar."}, {"tipo": "Denúncia", "numero": null, "data": "2024-03-04", "resumo": "O vereador Anderson Marcos Viana relatou que Centros de Educação Infantil (CEIs) passaram a pedir aos pais itens de higiene pessoal (sabonete, fralda) e alimentos, prática apontada como inédita, na mesma época em que recursos municipais eram usados em obras de concreto \"debaixo da linha\".", "nota": "Motivou o Requerimento nº 13/2024, apresentado na sessão seguinte (131ª)."}, {"tipo": "Indicação", "numero": "040", "data": "2024-03-04", "resumo": "Solicita a dedetização dos Centros Educacionais Infantis (CEIs) e escolas municipais para mitigar a presença de animais peçonhentos, especialmente escorpiões, após incidente em que uma criança foi picada.", "nota": "Esta sessão (expediente e indicações) é datada no próprio texto como 'a ser realizada em 4 de março de 2024', enquanto o arquivo está nomeado 2024-03-05. Adotei 2024-03-04 como data_sessao."}, {"tipo": "Requerimento", "numero": "11", "data": "2024-03-04", "resumo": "Solicita informações acerca do andamento do projeto de reconstrução da ponte localizada na estrada JQL-446, no bairro Segunda Sessão, que liga Junqueirópolis a Dracena.", "nota": "Aprovado por unanimidade de votos. Data da sessão conforme mencionada no texto (04/03/2024), divergente da data do arquivo (2024-03-05)."}, {"tipo": "Denúncia", "numero": null, "data": "2024-03-11", "resumo": "Os vereadores relataram que a obra de reforma e ampliação do CCI (Centro de Convivência do Idoso) não estava sendo devidamente fiscalizada: a empresa terceirizada mantinha apenas de um a quatro funcionários por dia, o piso estava sendo instalado antes da cobertura e era de qualidade questionável, e a engenheira responsável teria chegado ao portão da obra e voltado sem entrar para fiscalizar.", "nota": "Motivou o Requerimento nº 12/2024 e o pedido de vista que atrasou a votação do projeto de lei complementar nº 08/2024 (crédito adicional para a obra)."}, {"tipo": "Denúncia", "numero": null, "data": "2024-03-11", "resumo": "Vereadores relataram que o cemitério e o velório municipal estavam havia tempos tomados pelo mato, com muro caído em parte do perímetro, situação que motivou comentários jocosos de visitantes de outra cidade presentes a um velório no local.", "nota": "Após a indicação (nº 54/2024) apresentada nesta mesma sessão, a roçagem foi realizada ainda na mesma semana, segundo relato do vereador Elio Furini Neto na sessão seguinte (132ª)."}, {"tipo": "Indicação", "numero": "051", "data": "2024-03-11", "resumo": "Solicita a instalação de iluminação de LED na Rua do Viveiro e na Avenida Rio Branco, especialmente onde ocorre a feira municipal às sextas-feiras.", "nota": "Esta sessão é datada no texto como 'a ser realizada em 11 de março de 2024', enquanto o arquivo está nomeado 2024-03-12. Adotei 2024-03-11 como data_sessao."}, {"tipo": "Requerimento", "numero": "12", "data": "2024-03-11", "resumo": "Solicita esclarecimentos sobre os motivos que levaram à necessidade de aditamento no valor de R$ 82.400,00 para a reforma e ampliação do CCI (Centro de Convivência do Idoso) de Junqueirópolis, além de informações sobre o percentual de obra já concluído e o montante já pago até o momento.", "nota": "Aprovado por 5 votos a 3, após pedido de vista do autor na sessão anterior (130ª) ter sido aprovado por 5 votos a 3, retirando de pauta o projeto de lei complementar nº 08/2024 (crédito adicional suplementar para a mesma obra). Na sessão seguinte (132ª) a administração respondeu ao ofício e o referido projeto de lei foi aprovado."}, {"tipo": "Requerimento", "numero": "13", "data": "2024-03-11", "resumo": "Solicita esclarecimentos sobre a recente solicitação feita aos pais pelos Centros de Educação Infantil (CEIs), envolvendo pedidos de listas de materiais escolares e itens de higiene pessoal para seus filhos, prática apontada como inédita nos últimos anos.", "nota": "Aprovado por unanimidade de votos."}, {"tipo": "Requerimento", "numero": "14", "data": "2024-03-11", "resumo": "Solicita informações acerca de quantos servidores recebem a Gratificação por Trabalho por Tempo Integral e Dedicação Exclusiva (GTID), com relação de nome completo, cargo, função, setor e percentual de gratificação recebida, referente ao período de janeiro de 2024 até a data da resposta.", "nota": "Aprovado por unanimidade de votos. Requerimento similar já havia sido feito em anos anteriores, segundo relato em plenário."}, {"tipo": "Denúncia", "numero": null, "data": "2024-03-18", "resumo": "Em reunião do Conselho de Segurança (CONSEG) do bairro Alto do Cene, um integrante relatou aos vereadores presentes ter presenciado um quase atropelamento de um pedestre em frente à nova farmácia municipal: um veículo passou em alta velocidade para não perder o sinal do semáforo enquanto a pessoa atravessava a rua para acessar a farmácia.", "nota": "Motivou a indicação nº 56/2024, apresentada na sessão anterior (131ª), solicitando marcação de solo ou lombada em frente à farmácia."}, {"tipo": "Denúncia", "numero": null, "data": "2024-03-18", "resumo": "O vereador Paulo Sérgio Cordeiro relatou ter ido pessoalmente à Academia de Judô Municipal e constatado que a reforma anunciada consistiu apenas em pintura; segundo ele, o banheiro do local estava em condições tão precárias que teria vergonha de pedir a um pai ou mãe para utilizá-lo. O vereador afirmou ter filmado, mas optou por não divulgar o vídeo enquanto aguardava a reforma efetiva.", "nota": "Motivou o Requerimento nº 16/2024, apresentado na mesma sessão."}, {"tipo": "Denúncia", "numero": null, "data": "2024-03-18", "resumo": "O vereador Elio Furini Neto relatou reclamações de times visitantes durante campeonato realizado no Estádio Municipal Raphael Capelli sobre as condições dos vestiários: azulejos soltando, chuveiros pingando, privadas sem funcionar, falta de espaço e de iluminação adequada.", "nota": "Terceira indicação consecutiva sobre o tema (reforçando indicações de 2022 e 2023); motivou a indicação nº 82/2024, apresentada na sessão seguinte (134ª)."}, {"tipo": "Indicação", "numero": "057", "data": "2024-03-18", "resumo": "Solicita a manutenção dos ventiladores da Escola Estadual, além de buscar solução para doação de aparelhos de ar-condicionado para a escola, dado o impacto do calor no ambiente de estudo.", "nota": "Esta sessão é datada no texto como 'a ser realizada em 18 de março de 2024', enquanto o arquivo está nomeado 2024-03-19. Adotei 2024-03-18 como data_sessao. Além disso, o nome da patrona da escola estadual citada aparece de forma inconsistente na transcrição ('Escola Profº Idene Rodrigues dos Santos' no resumo do expediente e 'Escola Profº Idene Rodrigues dos Santos' na leitura integral) — não foi possível confirmar a grafia correta do nome."}, {"tipo": "Requerimento", "numero": "15", "data": "2024-03-18", "resumo": "Solicita cópias de todos os contratos de aluguéis celebrados entre a Prefeitura Municipal de Junqueirópolis e particulares, acompanhadas dos valores atualizados pagos mensalmente.", "nota": "Aprovado por unanimidade de votos. Resposta trouxe relação de 10 imóveis alugados (farmácia municipal, posto de recebimento, setor de água e esgoto, setor de trânsito, projeto Guri, CI Cristo, CRAS, Conselho Tutelar, Poupatempo, CREAS)."}, {"tipo": "Requerimento", "numero": "16", "data": "2024-03-18", "resumo": "Solicita relatório de gastos relativos à reforma da Academia de Judô do município neste ano, com descrição das melhorias realizadas, além de informações sobre os investimentos planejados para a construção da meia-quadra de basquete entre a pista de skate e a Academia de Judô.", "nota": "Aprovado por unanimidade de votos. Resposta da administração (ofício 70/2024) informou que não houve reforma, apenas manutenção (R$ 3.382,50), e que a meia-quadra de basquete estava em fase de terraplanagem, com investimento planejado de R$ 23.586,20."}, {"tipo": "Denúncia", "numero": null, "data": "2024-03-25", "resumo": "O vereador Anderson Marcos Viana relatou o sucateamento do transporte de pacientes do município: uma van usada como ambulância apresentava marcas de acidente, o cinto de segurança não encaixava, peças de ferro caíam do veículo, e o veículo parava a cada 10 quilômetros rodados, exigindo intervenção improvisada do próprio motorista para continuar a viagem.", "nota": "Vereador afirmou ter recebido relatos de mais de seis munícipes sobre o mesmo veículo no mesmo dia e possuir vídeo do ocorrido."}, {"tipo": "Denúncia", "numero": null, "data": "2024-03-25", "resumo": "O vereador Anderson Marcos Viana relatou que um ponto de ônibus foi construído \"dentro do mato\" no bairro Conde, em local de difícil acesso, dificultando a manobra do ônibus para realizar a parada.", "nota": "Citado de forma breve pelo vereador como exemplo de má escolha de local para instalação de mobiliário urbano."}, {"tipo": "Indicação", "numero": "067", "data": "2024-03-25", "resumo": "Solicita melhorias no ponto de ônibus localizado na interseção da Rua José Bonifácio com a Rua das Américas, que se encontra deteriorado (assento afundado e cobertura destruída).", "nota": "Esta sessão é datada no texto como 'a ser realizada em 25 de março de 2024', enquanto o arquivo está nomeado 2024-03-26. Adotei 2024-03-25 como data_sessao."}, {"tipo": "Denúncia", "numero": null, "data": "2024-04-01", "resumo": "O vereador Anderson Marcos Viana relatou que a obra de contenção do \"Buracão\" do Jardim Paulista (financiada por operação de crédito de aproximadamente R$ 2,5 milhões aprovada em 2023) estava novamente parada meses após o início esperado: as aduelas (manilhas de concreto) já instaladas começaram a ceder e cair, e o barranco erodido estava a poucos metros de uma residência.", "nota": "Tema relacionado ao Requerimento nº 09/2024, apresentado na sessão 129ª sobre a mesma operação de crédito."}, {"tipo": "Indicação", "numero": "078", "data": "2024-04-01", "resumo": "Solicita a manutenção da calçada situada no cruzamento da Rua Belo Horizonte com a Rua da Paz, atualmente tomada por vegetação e entulho.", "nota": "Esta sessão é datada no texto como 'a ser realizada em 1º de abril de 2024', enquanto o arquivo está nomeado 2024-04-02. Adotei 2024-04-01 como data_sessao."}, {"tipo": "Requerimento", "numero": "17", "data": "2024-04-01", "resumo": "Solicita esclarecimentos sobre os procedimentos e investimentos oferecidos pelo CAPS (Centro de Atenção Psicossocial) aos indivíduos que lutam contra dependência química, visando sua reintegração social, e a eficácia dos recursos aplicados.", "nota": "Aprovado por unanimidade de votos. Data da sessão conforme mencionada no texto (01/04/2024), divergente da data do arquivo (2024-04-02). Na 133ª Sessão Ordinária (25/03/2024, arquivo 2024-03-26) não houve apresentação de requerimentos, apenas indicações (67 a 77/2024) e projetos de lei."}, {"tipo": "Denúncia", "numero": null, "data": "2024-04-08", "resumo": "O vereador critica publicamente a resposta da administração (ofício nº 022/2024) a um requerimento anterior seu sobre o calçamento construído pela Prefeitura na Rua Vitor Camargo Bunini (bairro Frei Galvão), ao lado do estabelecimento 3D Lava Rápido: alega que o ofício classificou o local como 'área verde', quando seria terreno particular onde há máquinas pesadas guardadas, e que a resposta não detalhou os gastos como solicitado, informando apenas a metragem de concreto usada. Afirma ter acionado o Ministério Público pela demora na resposta e informa que fará novo requerimento sobre o tema.", "nota": "A resposta formal a esse requerimento original (ofício nº 022/2024, informando o mesmo teor criticado pelo vereador) foi lida oficialmente na sessão seguinte (2024-04-15), como ofício nº 075/2024."}, {"tipo": "Denúncia", "numero": null, "data": "2024-04-08", "resumo": "O vereador cobra, há cerca de 3 a 4 anos sem sucesso, uma simples roçagem de mato alto na Rua São Salvador (final do Jardim Alvorada, próximo à linha férrea), relatando que os próprios moradores acabam ateando fogo no matagal todos os anos para conseguir baixá-lo, na ausência de manutenção pelo poder público.", "nota": "Não fica claro no texto qual diretoria seria responsável pela roçagem (Planejamento/Obras ou Agronegócio/Meio Ambiente e Gestão de Resíduos Sólidos); mantive null."}, {"tipo": "Requerimento", "numero": "018", "data": "2024-04-15", "resumo": "Solicita, em complemento aos requerimentos nº 05/2024 e nº 56/2023, informações ao prefeito municipal sobre o serviço prestado pela empresa Oeste Comunicações Eireli ME durante o ano de 2023, incluindo detalhes sobre campanhas de publicidade realizadas, eventos cobertos/filmados e vídeos ou artes produzidos, solicitando também o envio digital do material produzido.", "nota": "O presidente da Câmara manifestou publicamente ser contrário a este requerimento (embora não vote), mas ele foi aprovado por unanimidade dos vereadores votantes. A diretoria de destino foi inferida como Administrativa, por se tratar de contrato de comunicação/publicidade; o texto não especifica explicitamente qual diretoria deveria responder."}, {"tipo": "Requerimento", "numero": "019", "data": "2024-04-15", "resumo": "Solicita informações ao prefeito municipal sobre os valores repassados à Santa Casa de Misericórdia relativos ao Piso Nacional da Enfermagem, incluindo especificação dos meses abrangidos pelo repasse e a respectiva data de transferência.", "nota": "Na transcrição o vereador aparece grafado ora como 'Elio Furini Neto', ora como 'Elio Furini Neto'; mantive o nome oficial da lista de vereadores da 18ª Legislatura."}, {"tipo": "Requerimento", "numero": "021", "data": "2024-04-15", "resumo": "Solicita informações ao prefeito municipal sobre o status do financiamento para a execução das obras do 'Buracão' (erosão do Jardim Paulista/Autopaulista), requisitando cópia do contrato de financiamento caso a resposta seja afirmativa.", "nota": "A resposta a este requerimento (ofício nº 023/2024) foi lida na sessão seguinte (138ª, 2024-04-29), assinada pela Diretoria de Fazenda, Compras, Almoxarifado e RH, informando que o contrato de financiamento junto à Desenvolve SP havia sido formalizado em 05/04/2024, mas ainda estava em fase de registro."}, {"tipo": "Denúncia", "numero": null, "data": "2024-04-22", "resumo": "O vereador denuncia que a administração não cumpre o prazo legal de 15 dias para resposta aos requerimentos da Câmara, citando casos que levaram de 4 a 5 meses para serem respondidos. Relata ter feito denúncia ao Ministério Público, que respondeu que a fiscalização do cumprimento do prazo é de responsabilidade da própria Câmara Municipal, e pede que o assunto seja encaminhado à comissão composta pelos vereadores Rui Domingos da Silva, Sofia Rodrigues dos Santos e Teresinha de Lourdes Freitas Regodanso.", "nota": "Trata-se de reclamação sobre o funcionamento interno da administração/Câmara (prazo de resposta a requerimentos), sem diretoria específica de destino."}, {"tipo": "Denúncia", "numero": null, "data": "2024-04-22", "resumo": "O vereador aponta contradição: enquanto famílias do Jardim Alvorada são notificadas judicialmente para deixar a faixa de domínio da antiga linha férrea, a Prefeitura estaria construindo, dentro dessa mesma área (que classifica como irregular, conforme projeto de retificação do DNIT), um salão comunitário no bairro Pioneiros, com recursos públicos da ordem de R$ 700 mil.", "nota": "O valor de R$ 700 mil e a irregularidade do terreno são alegações do próprio vereador, não confirmadas de forma independente no texto da sessão."}, {"tipo": "Requerimento", "numero": "022", "data": "2024-04-22", "resumo": "Solicita ao prefeito municipal justificativa e fundamentação da publicação do Decreto nº 7.399, de 20/02/2024, que dispõe sobre a adoção dos mecanismos do artigo 167-A da Constituição Federal (contenção de despesas), incluindo o cálculo da contabilidade que apurou a superação do índice previsto no referido artigo. Solicita também a relação de todas as contratações efetivas e temporárias de servidores realizadas após 20/02/2024, informação sobre eventual anulação de contratação ou convocação de servidor após essa data, e a relação de gratificações concedidas a servidores municipais após 20/02/2024.", "nota": "Este requerimento formaliza uma preocupação já verbalizada pelo vereador na sessão anterior (2024-04-15), sobre possível anulação de convocações de concurso público em razão do decreto de contenção fiscal."}, {"tipo": "Denúncia", "numero": null, "data": "2024-04-29", "resumo": "A vereadora relata que a obra da sede do Clube da Viola está paralisada novamente, apesar de promessas reiteradas de conclusão, e relata o falecimento recente de um dos integrantes idosos do clube (Anatalício/Natalício Inácio), que não chegou a ver a obra concluída, cobrando que promessas só sejam feitas quando houver real capacidade de cumpri-las.", "nota": "Na sessão seguinte (2024-05-06), o vereador Reinaldo Codognato informou que a obra estava em fase final (grades e portões), com promessa de conclusão até junho de 2024."}, {"tipo": "Denúncia", "numero": null, "data": "2024-04-29", "resumo": "O vereador relata reclamação pública do time de futebol amador do bairro Vila São João, que teve de fazer rateio entre os próprios jogadores para custear transporte a jogos fora da cidade, e questiona a destinação da verba pública para o esporte municipal, alegando que ela seria concentrada no campeonato de campo (cuja inscrição já é paga pelos próprios times), enquanto atletas de outras modalidades (ex.: judô) dependeriam de rifas e vaquinhas das próprias famílias para competir fora da cidade.", "nota": "O vereador também relata, sem citar nomes, ter ouvido de moradores de um bairro que 'pediram para o vereador errado', insinuando favorecimento político na liberação de obras conforme o vereador que fizer o pedido; trata-se de relato de boato, sem prova concreta apresentada na sessão."}, {"tipo": "Requerimento", "numero": "023", "data": "2024-04-29", "resumo": "Solicita informações/providências ao prefeito municipal sobre a contaminação de córregos nas proximidades do município, com destaque para o Córrego Colibri (bairro Palmeira), poluído por esgoto e resíduos, com danos comprovados por vídeo à fauna e à flora locais.", "nota": "O arquivo de transcrição desta sessão (2024-04-30_sessao.txt) começa cortado, já no meio da leitura deste requerimento; o resumo foi reconstituído a partir do trecho final capturado e da referência a este mesmo requerimento (enviado em 30/04/2024, mencionando também um córrego no bairro Saúde) feita na sessão de 2024-06-03, já registrada no lote16 (raw_denuncias_2021_2024_lote16.json)."}, {"tipo": "Denúncia", "numero": null, "data": "2024-05-06", "resumo": "O vereador relata que o município obteve, via emenda parlamentar do ex-Deputado Reinaldo Alguz, recurso de aproximadamente R$ 400 mil para a construção de um prédio próprio do CRAS, mas o valor acabou sendo devolvido sem uso, enquanto a Prefeitura continua pagando cerca de R$ 1.500,00 mensais de aluguel de um imóvel no bairro Alvorada para o funcionamento do CRAS.", "nota": "Relato ligado ao Requerimento nº 024/2024 (vereador Elio Furini Neto), que solicitou cópia da rescisão desse mesmo convênio."}, {"tipo": "Denúncia", "numero": null, "data": "2024-05-06", "resumo": "O vereador relata que recurso de aproximadamente R$ 90 mil (mais R$ 20 mil adicionais, via emenda do vereador Reinaldo Codognato), obtido em nome da vereadora Marisa Alves da Silva Costa para ações de proteção/causa animal, não pôde ser efetivamente utilizado pela causa animal, apesar de o nome dela ter sido usado na captação do recurso.", "nota": "Não ficou claro no relato se o recurso foi de fato devolvido ao órgão de origem ou apenas permanece não utilizado, nem qual seria a diretoria responsável (causa/proteção animal não corresponde a nenhuma diretoria da lista oficial fornecida)."}, {"tipo": "Requerimento", "numero": "024", "data": "2024-05-06", "resumo": "Solicita cópia da rescisão do convênio de repasse (recurso de emenda parlamentar de aproximadamente R$ 400 mil) destinado à construção do Centro de Referência de Assistência Social (CRAS).", "nota": "Diferentemente do padrão dos demais requerimentos do lote (dirigidos ao prefeito municipal), o texto lido em sessão direciona o pedido diretamente à Diretoria de Assistência e Desenvolvimento Social."}, {"tipo": "Indicação", "numero": "129", "data": "2024-05-13", "resumo": "Reforçando a indicação nº 092/2023, solicita que se estude junto ao setor competente da administração as possibilidades de adequar a iluminação das mesas/áreas verdes dos bairros Aliança, Campo Belo, Carmesim II e demais áreas que forem necessárias, visando mais segurança aos moradores e frequentadores desses espaços à noite.", "nota": "O arquivo 2024-05-14_sessao.txt traz apenas um AVISO informando que os primeiros ~17 minutos do áudio original (sessão de 13/05/2024) não continham fala detectável e foram removidos; a transcrição real começa em andamento, faltando abertura, chamada e parte do Expediente. O único trecho de fala real capturado é o início desta indicação (garbled: 'reforçando a integração número 092 para 2023... a possibilidade de adequar a iluminação das mesas, das áreas verdes dos bairros, aliança, quanto Belo, Carmesin 2'), sem número, sem nome de autor e sem encerramento. Reconstruí número (129/2024), autores e data de apresentação (06/05/2024) por correspondência textual exata com o registro oficial em painel_indicacoes/data/oficial_indicacoes_2021_2024.csv. A sessão em que foi lida (140ª Ordinária) e sua data (13/05/2024) foram inferidas a partir da ata aprovada no início da sessão seguinte (2024-05-21_sessao.txt: 'ata da centésima quadragésima sessão ordinária, realizada no dia 13 de maio de 2024'). Registro de baixíssima confiança devido à falha técnica de áudio relatada no aviso."}, {"tipo": "Denúncia", "numero": null, "data": "2024-05-20", "resumo": "O vereador relata ter sido procurado por moradores e pela comunidade católica, que lhe entregaram cerca de 200 cartas em apoio ao Padre Silvio, pedindo uma explicação sobre a remoção do padre da paróquia local, e se comprometeu a buscar uma resposta concreta junto à hierarquia da Igreja sobre o ocorrido.", "nota": "Caso limítrofe: trata-se de assunto interno da Diocese/Paróquia Santo Antônio de Junqueirópolis (transferência de um padre), não de administração pública municipal, mas foi tratado nesta sessão como uma reivindicação concreta trazida por moradores ao vereador, com pedido explícito de providência dele. Incluído por se enquadrar na definição ampla de 'denúncia recebida de moradores sobre algo específico'."}, {"tipo": "Denúncia", "numero": null, "data": "2024-05-20", "resumo": "O vereador relata caso concreto de uma cachorra que morreu num final de semana, gerando repercussão e discussão em grupos de redes sociais entre a família do animal e voluntárias da causa animal (incluindo a vereadora Marisa); ele ouviu áudios de ambos os lados e mediou pedindo desculpas às partes, ressaltando que a causa animal é responsabilidade de saúde pública que a administração não assume adequadamente.", "nota": "Caso limítrofe entre disputa privada e cobrança à administração pela falta de estrutura pública para causa animal; incluído por envolver um caso concreto relatado ao vereador, com pedido de mediação/providência."}, {"tipo": "Indicação", "numero": "138", "data": "2024-05-20", "resumo": "Reforçando a indicação nº 078/2023, solicita a instalação de diversas benfeitorias no Centro Educacional Infantil Raio de Luz: instalação de câmeras, cobertura no espaço lateral já cimentado com bancos, banheiros e bebedouros para o novo bloco, coberturas ligando as novas salas ao bloco principal, coberturas na entrada e saída dos alunos e cercamento em volta do novo bloco, visando reforçar segurança e bem-estar de alunos e colaboradores.", "nota": "O resumo do Expediente lido no início da sessão de 2024-05-21 identifica esta como a 141ª Sessão Ordinária a ser realizada em '30 de maio de 2024', mas o texto integral da própria indicação (lido mais adiante) e as demais indicações da mesma leva (139 a 142) trazem 'em 20 de maio de 2024', data condizente com o nome do arquivo (upload no dia seguinte). Usei a data do texto integral (20/05/2024) por ser mais específica e consistente entre todas as indicações da sessão; a menção a '30 de maio' no resumo do Expediente parece erro de transcrição/fala do vereador."}, {"tipo": "Requerimento", "numero": "025", "data": "2024-05-20", "resumo": "Solicita o envio de ofício à Diretoria de Fazenda, Compras, Almoxarifado e Recursos Humanos requerendo informações detalhadas sobre o número de servidores efetivos da prefeitura, bem como a soma de seus salários base, líquido e bruto, referentes às datas de 31/12/2020, 31/12/2021, 31/12/2022, 31/12/2023 e abril/2024.", "nota": "Há divergência na data final do período solicitado: o resumo do Expediente e a leitura do texto integral do requerimento mencionam datas diferentes para o último corte (\"31 de abril de 2024\" no resumo do Expediente, mas \"31 de dezembro de 2024\" — data futura, impossível na época — na leitura do texto integral do requerimento). Optei por manter o resumo genérico sem fixar a data exata do último corte, por parecer erro de transcrição/fala. A resposta a este requerimento (ofício nº 033/2024 da Diretoria de Fazenda, remetendo ao portal da transparência) foi lida na sessão de 2024-06-11, mas como não cita explicitamente 'ofício de resposta a este requerimento específico' por número formal de resposta dedicado, mantive oficio_resposta e status_resposta como null, conforme critério do lote."}, {"tipo": "Requerimento", "numero": "026", "data": "2024-05-20", "resumo": "Solicita o envio de ofício à Diretoria de Fazenda, Compras, Almoxarifado e Recursos Humanos requerendo relação detalhada das férias adquiridas e gozadas pelos servidores que ocupam cargos comissionados ou funções de confiança.", "nota": "A resposta (ofício nº 034/2024) foi lida na sessão de 2024-06-11, mas sem citar formalmente ser resposta a este requerimento por número; mantive oficio_resposta e status_resposta como null."}, {"tipo": "Denúncia", "numero": null, "data": "2024-06-03", "resumo": "O vereador relata ter enviado uma denúncia ao Ministério Público sobre irregularidades contra a administração/contra o prefeito, e que o Ministério Público respondeu que a apuração seria de competência da própria Câmara Municipal, motivo pelo qual pediu que o assunto fosse encaminhado à comissão formada pelos vereadores Rui Domingos da Silva, Sofia Rodrigues dos Santos e Teresinha de Lourdes Freitas Regodanso.", "nota": "O vereador não especifica no trecho transcrito qual seria exatamente a irregularidade denunciada ao Ministério Público; o contexto da fala é vago ('essas irregularidades... contra a administração, deixando bem claro a irregularidade contra o prefeito'). Não foi possível identificar com segurança o teor exato do fato denunciado nem a diretoria/órgão de destino."}, {"tipo": "Denúncia", "numero": null, "data": "2024-06-03", "resumo": "O vereador denuncia o desaparecimento de aproximadamente 8 caminhões-truck de pedra portuguesa retirada do Praça do Centenário (destinada à reforma da praça), afirmando estar 'em cima' do caso e cobrando explicação sobre o destino desse patrimônio público, que segundo ele desapareceu sem justificativa.", "nota": "O vereador não indica claramente a qual diretoria ou órgão está direcionando a cobrança; menciona apenas que 'vem na justiça' e está acompanhando o caso."}, {"tipo": "Indicação", "numero": "143", "data": "2024-06-03", "resumo": "Reforçando a indicação nº 34/2023, solicita que se estude fornecer alimentação (marmitex, ou ao menos um lanche reforçado pela manhã e no horário do almoço) aos pacientes que se deslocam a Presidente Prudente para consultas médicas e passam o dia aguardando atendimento, muitas vezes sem condições financeiras para se alimentar.", "nota": "No resumo do Expediente e no cabeçalho lido junto com esta indicação (e também das indicações 144-145 e do requerimento 27), consta 'centésima, quadragésima, segunda sessão ordinária... em 27 de maio de 2024', que corresponde na verdade à sessão ANTERIOR (142ª, cuja ata foi aprovada no início desta sessão). A abertura da própria sessão, porém, afirma claramente tratar-se da 143ª Sessão Ordinária, com Expediente 'a ser realizada em 3 de junho de 2024' (arquivo nomeado 2024-06-04, padrão de upload no dia seguinte). Usei 143ª/03-06-2024 por ser a sessão em que a leitura de fato ocorreu; o cabeçalho de leitura repetindo dados da sessão anterior parece erro de transcrição/leitura do vereador."}, {"tipo": "Indicação", "numero": "144", "data": "2024-06-03", "resumo": "Solicita a instalação de cortinas ou insufilme nas vans que transportam cadeirantes, para proteger os pacientes da exposição solar intensa durante o transporte, prevenindo queimaduras, desidratação e outros problemas de saúde.", "nota": "Mesma observação sobre a data/número de sessão constante no cabeçalho de leitura da indicação 143/2024 desta mesma sessão."}, {"tipo": "Indicação", "numero": "145", "data": "2024-06-03", "resumo": "Solicita a inclusão no calendário municipal de um torneio de futebol de categorias de base com participação de equipes de renome nacional, visando promover esporte e saúde entre jovens, fortalecer o turismo local e servir de inspiração para atletas locais.", "nota": "Mesma observação sobre a data/número de sessão constante no cabeçalho de leitura da indicação 143/2024 desta mesma sessão."}, {"tipo": "Requerimento", "numero": "027", "data": "2024-06-03", "resumo": "Solicita o envio de ofício à Diretoria de Agronegócio, Indústria, Comércio e Meio Ambiente e Gestão de Resíduos Sólidos requerendo informações detalhadas sobre a fundamentação do corte de árvores e demais vegetações na área verde localizada no encontro da Avenida Paulista com a Avenida Latina, e sobre como será garantido o correto escoamento de água nessa área.", "nota": "O cabeçalho de leitura deste requerimento traz 'centésima, quadragésima, segunda sessão ordinária... em 27 de maio de 2024', mas a abertura da sessão confirma tratar-se da 143ª Sessão Ordinária (03/06/2024); usei esta última, mesma observação das indicações 143-145 lidas na mesma sessão."}, {"tipo": "Denúncia", "numero": null, "data": "2024-06-10", "resumo": "O vereador relata que um recurso de R$ 50 mil conseguido através do ex-Deputado Reinaldo Alguz para a Cooperativa Cooper Junque nunca foi repassado à entidade, e que até o momento não se sabe o que aconteceu com esse dinheiro.", "nota": "Relato pontual em explicações pessoais, sem detalhamento de quando o recurso foi obtido nem de qual órgão seria responsável pelo repasse; incluído por se tratar de caso concreto (verba pública supostamente não repassada) mencionado explicitamente pelo vereador."}, {"tipo": "Indicação", "numero": "147", "data": "2024-06-10", "resumo": "Solicita que se estude a implementação da equoterapia (ecoterapia/terapia assistida com cavalos) no município, prática reconhecida por seus benefícios no desenvolvimento de crianças com autismo, melhorando coordenação motora, equilíbrio, confiança e comunicação.", "nota": "No resumo do Expediente, esta indicação foi lida por engano com o mesmo número da anterior ('Indicação número 146' repetida duas vezes seguidas). No texto integral, lido mais adiante na sessão, ela é corretamente identificada como Indicação número 147/2024; usei esse número."}, {"tipo": "Denúncia", "numero": null, "data": "2024-06-17", "resumo": "Carta anônima de um servidor público, lida em plenário pela vereadora Marisa Alves da Silva Costa, questiona por que a verba de R$ 2,5 milhões votada pela Câmara para tapar o buraco conhecido como 'Catengolândia' e realizar melhorias na Lagoa de Tratamento (apontada como muito fétida) não foi usada, enquanto o Executivo agiu rapidamente (inclusive de madrugada) para reverter em juízo a decisão sobre os cargos comissionados.", "nota": "O valor de R$ 2,5 milhões e o projeto específico não foram confirmados de forma independente no texto da sessão (a carta é de autoria de um munícipe/servidor não identificado, com fatos não verificados pela própria vereadora que a leu). A Lagoa de Tratamento pode se enquadrar também em Diretoria de Agronegócio/Meio Ambiente; mantive Obras por ser a diretoria mais associada ao 'buracão' mencionado."}, {"tipo": "Denúncia", "numero": null, "data": "2024-06-17", "resumo": "O vereador levanta suspeita de favorecimento no processo seletivo para as vagas de cuidadores/técnica de enfermagem da nova residência terapêutica (parceria com a Santa Casa), alegando que moradores o procuraram e que, segundo ele, os selecionados seriam recorrentemente dos mesmos sobrenomes/famílias, e que pedirá explicações sobre o critério de seleção utilizado.", "nota": "Suspeita levantada sem provas concretas apresentadas na sessão; o próprio vereador afirma que ainda vai pedir explicações formalmente. Não ficou claro se o processo seletivo foi conduzido pela Santa Casa, pela administração municipal ou por ambas, nem a diretoria responsável."}, {"tipo": "Indicação", "numero": "154", "data": "2024-06-17", "resumo": "Solicita a implementação de sinalização vertical indicando a velocidade máxima permitida nas proximidades do Colégio Objetivo 13 de Junho, especialmente na Avenida Junqueira (grande declive, onde veículos trafegam em alta velocidade), a pedido dos próprios alunos após quase-acidentes no local.", "nota": "O vereador Elio Furini Neto assinou a indicação em apoio à autora principal (Teresinha de Lourdes Freitas Regodanso), conforme relatado nas explicações pessoais da sessão."}, {"tipo": "Denúncia", "numero": null, "data": "2024-06-25", "resumo": "Vereador relata ter recebido várias denúncias, nos dias anteriores, sobre irregularidades no processo seletivo da Santa Casa (favorecimento, sempre as mesmas pessoas sendo selecionadas), afirmando que, ao voltar do recesso, encaminhará documentação sobre o caso aos órgãos responsáveis, incluindo o Ministério Público, já que instituições que recebem dinheiro público em folha de pagamento são obrigadas a realizar processo seletivo.", "nota": "Relato feito em explicação pessoal no arquivo 'clipe' 2024-06-25_sessao.txt. O vereador não detalhou publicamente o conteúdo específico das denúncias recebidas, apenas o tema (processo seletivo) e sua intenção de formalizar o caso ao Ministério Público."}, {"tipo": "Indicação", "numero": "155", "data": "2024-06-25", "resumo": "Solicita ao prefeito municipal que estude a possibilidade de utilizar drones para reforçar o combate à dengue, facilitando a identificação de focos em locais de difícil acesso (imóveis vazios, telhados) e o mapeamento de criadouros como caixas d'água e depósitos, especialmente em imóveis abandonados e lotes vagos, sem substituir as inspeções semanais já realizadas.", "nota": "O texto das indicações e do expediente desta sessão data consistentemente '24 de junho de 2024' (uma segunda-feira), divergindo do nome do arquivo (2024-06-25); mantida a data do nome do arquivo por instrução específica para este lote, seguindo o padrão já usado em lotes anteriores (data do arquivo = dia da postagem/upload)."}, {"tipo": "Requerimento", "numero": null, "data": "2024-06-25", "resumo": "Pedido verbal para que a prefeitura envie à Câmara o projeto da reforma do velório municipal (obra iniciada aparentemente sem planejamento e sem aviso prévio às funerárias) e explique o quanto está orçada a obra, já que nenhuma verba específica havia sido submetida à aprovação da Câmara e não se sabia se seria custeada com recurso próprio.", "nota": "Este pedido aparece no arquivo 'clipe' 2024-06-25_sessao.txt, que começa em andamento sem identificar o orador. Pelo contexto (fala de uma vereadora que se encerra com 'Obrigado, vereadora' antes de passar a palavra ao vereador Anderson, e por afinidade temática com a fala anterior dela sobre a Festa de Santo Antônio), atribuído por inferência à vereadora Terezinha de Lourdes Freitas Regodanso, mas a autoria não pôde ser confirmada com certeza pois o início da fala foi cortado no arquivo. Tema retomado formalmente na Indicação nº 168/2024 (sessão de 20/08/2024), sobre placas de transparência dos valores da mesma obra."}, {"tipo": "Requerimento", "numero": null, "data": "2024-06-25", "resumo": "Pedido verbal, em explicação pessoal, para que o setor responsável dê atenção ao bueiro entupido na Rua Rui Barbosa, esquina com a Avenida Junqueira, próximo ao Posto São Paulo, com acúmulo de sujeira e mau cheiro no local.", "nota": "Pedido feito em explicação pessoal no arquivo 'clipe' 2024-06-25_sessao.txt, sem numeração formal de requerimento."}, {"tipo": "Requerimento", "numero": null, "data": "2024-06-25", "resumo": "Pedido verbal, em explicação pessoal, para que o setor responsável dê atenção aos brinquedos do Bosque municipal, citando dois acidentes recentes (uma senhora machucou a clavícula e uma criança possivelmente fraturou o braço) devido ao uso intenso dos equipamentos nos finais de semana.", "nota": "Pedido feito em explicação pessoal no arquivo 'clipe' 2024-06-25_sessao.txt, sem numeração formal de requerimento. Diretoria de destino incerta entre Educação/Lazer (Bosque como espaço de lazer) e Planejamento/Obras (manutenção física dos brinquedos); optou-se pela primeira por se tratar de equipamento de lazer público."}, {"tipo": "Requerimento", "numero": null, "data": "2024-06-25", "resumo": "Pedido verbal, em explicação pessoal, para que a administração dê atenção à falta de médicos no pronto-socorro, relatando um final de semana com o setor de saúde lotado, apenas um médico e três enfermeiras de plantão, incluindo dois acidentes de moto, e solicitando a disponibilização de dois médicos no plantão.", "nota": "Pedido feito em explicação pessoal no arquivo 'clipe' 2024-06-25_sessao.txt, sem numeração formal de requerimento."}, {"tipo": "Denúncia", "numero": null, "data": "2024-08-20", "resumo": "Vereador relata ter recebido ligações e relatos de denúncias anônimas da população sobre eventuais irregularidades ocorridas no Centro de Atenção Psicossocial (CAPS), o que motivou a apresentação do Requerimento nº 031/2024 solicitando as filmagens das câmeras de segurança do local para apurar o caso.", "nota": "Relato feito em explicação pessoal, ligado diretamente ao Requerimento nº 031/2024. Data da sessão conforme texto: 19/08/2024 (nome do arquivo: 2024-08-20). O vereador não detalhou publicamente a natureza específica das irregularidades denunciadas."}, {"tipo": "Indicação", "numero": "163", "data": "2024-08-20", "resumo": "Solicita ao prefeito municipal a implementação de sistema de iluminação e irrigação na pista de motocross, substituindo o uso de caminhão-pipa por um mecanismo de irrigação, beneficiando os competidores do município e fomentando o esporte local.", "nota": "O texto do expediente e das indicações desta sessão data '19 de agosto de 2024' (segunda-feira), divergindo do nome do arquivo (2024-08-20); mantida a data do arquivo por consistência com o padrão de outros lotes (data do arquivo = dia da postagem/upload)."}, {"tipo": "Requerimento", "numero": "031", "data": "2024-08-20", "resumo": "Solicita à Diretoria Administrativa o envio das filmagens das câmeras de segurança do Centro de Atenção Psicossocial (CAPS) dos últimos três meses, em razão de relatos e ligações anônimas da população sobre eventuais irregularidades ocorridas no local.", "nota": "Aprovado por unanimidade de votos. Data da sessão conforme texto: 19/08/2024 (nome do arquivo: 2024-08-20)."}, {"tipo": "Indicação", "numero": "170", "data": "2024-08-27", "resumo": "Solicita ao prefeito municipal que estude o redirecionamento adequado do fluxo de águas pluviais na interseção da Avenida Campos Salles com a Avenida Junqueira, onde a água tem invadido residências por falta de escoamento adequado, especialmente devido a uma valeta próxima.", "nota": "O texto do expediente e das indicações desta sessão data '26 de agosto de 2024' (segunda-feira), divergindo do nome do arquivo (2024-08-27); mantida a data do arquivo por consistência com o padrão de outros lotes. O expediente lido chamou a sessão de '100ª a 56ª' por lapso, mas o restante do texto (indicações, requerimento) identifica corretamente como '150ª Sessão Ordinária'."}, {"tipo": "Requerimento", "numero": "032", "data": "2024-08-27", "resumo": "Solicita à Diretoria de Saúde relação detalhada dos veículos destinados ao transporte de pacientes: quantidade total, quantos em condições de uso, quantos fora de serviço e o motivo, quantos quebrados, quantos em manutenção, quantos com seguro vigente e quantos com rastreador instalado, com identificação individual de cada veículo.", "nota": "Aprovado por unanimidade de votos. Data da sessão conforme texto: 26/08/2024 (nome do arquivo: 2024-08-27). Motivado por incidente relatado em plenário: uma ambulância em transferência de emergência quebrou no caminho a Presidente Prudente, exigindo acionamento do SAMU."}, {"tipo": "Requerimento", "numero": "33", "data": "2024-09-02", "resumo": "Solicita ao Tribunal de Justiça do Estado de São Paulo informações sobre a previsão de nomeação de novos oficiais de justiça para a comarca de Junqueirópolis, tendo em vista a homologação do const tipos = [...new Set(DATA.map(d => d.tipo))];
const tipoFiltersEl = document.getElementById('tipo-filters');
const activeTipos = new Set(tipos);

tipos.forEach(tipo => {
  const btn = document.createElement('button');
  btn.className = 'filter-chip';
  btn.textContent = tipo;
  btn.setAttribute('aria-pressed', 'true');
  btn.addEventListener('click', () => {
    if (activeTipos.has(tipo)) {
      activeTipos.delete(tipo);
      btn.setAttribute('aria-pressed', 'false');
    } else {
      activeTipos.add(tipo);
      btn.setAttribute('aria-pressed', 'true');
    }
    render();
  });
  tipoFiltersEl.appendChild(btn);
});

const searchEl = document.getElementById('search');
searchEl.addEventListener('input', render);

function formatDate(iso) {
  if (!iso || iso === 'sem-data') return 'Data não identificada';
  const [y, m, d] = iso.split('-');
  const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  return `${parseInt(d,10)} de ${meses[parseInt(m,10)-1]} de ${y}`;
}

function render() {
  const q = searchEl.value.trim().toLowerCase();
  const filtered = DATA.filter(item => {
    if (!activeTipos.has(item.tipo)) return false;
    if (!q) return true;
    return (item.nota + ' ' + item.resumo + ' ' + (item.numero||'')).toLowerCase().includes(q);
  });

  document.getElementById('stat-total').textContent = DATA.length;
  document.getElementById('stat-shown').textContent = filtered.length;
  document.getElementById('count-line').textContent = `${filtered.length} de ${DATA.length} itens`;

  const resultsEl = document.getElementById('results');
  resultsEl.innerHTML = '';
  document.getElementById('empty-msg').style.display = filtered.length ? 'none' : 'block';

  const byDate = {};
  filtered.forEach(item => {
    const key = item.data || 'sem-data';
    (byDate[key] = byDate[key] || []).push(item);
  });
  const dates = Object.keys(byDate).sort();

  dates.forEach(date => {
    const group = document.createElement('div');
    group.className = 'date-group';
    const h2 = document.createElement('h2');
    h2.innerHTML = formatDate(date) + ` <span class="n">(${byDate[date].length})</span>`;
    group.appendChild(h2);

    byDate[date].forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      const meta = document.createElement('div');
      meta.className = 'meta';
      const badge = document.createElement('span');
      badge.className = 'badge ' + item.tipo;
      badge.textContent = item.tipo;
      meta.appendChild(badge);
      if (item.numero) {
        const num = document.createElement('span');
        num.className = 'num';
        num.textContent = 'nº ' + item.numero;
        meta.appendChild(num);
      }
      card.appendChild(meta);

      if (item.resumo) {
        const resumo = document.createElement('p');
        resumo.className = 'resumo';
        resumo.textContent = item.resumo;
        card.appendChild(resumo);
      }

      const nota = document.createElement('div');
      nota.className = 'nota';
      nota.textContent = item.nota;
      card.appendChild(nota);

      group.appendChild(card);
    });

    resultsEl.appendChild(group);
  });
}

render();
</script>
